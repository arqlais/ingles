<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubi English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: painel de vidro fosco sobre um céu lilás com manchas de luz. Barra lateral no desktop, barra inferior no celular. Cartões brancos sólidos só para o que pede foco. */
:root {
  --bg: #E7E3F6;
  --blob-1: #C9BFFA;
  --blob-2: #F7C3DE;
  --blob-3: #B9CCF7;
  --glass: rgba(255, 255, 255, .52);
  --glass-strong: rgba(255, 255, 255, .78);
  --glass-border: rgba(255, 255, 255, .75);
  --solid: #FFFFFF;
  --sunken: rgba(98, 76, 170, .07);
  --ink: #1C1533;
  --muted: #6B6485;
  --line: rgba(98, 76, 170, .14);
  --btn: #1C1533;
  --btn-ink: #FFFFFF;
  --accent: #FF4F94;
  --accent-soft: #FFD3E5;
  --violet: #6C55F0;
  --violet-soft: #E3DDFF;
  --mint: #D5F2E3;
  --peach: #FFE6D2;
  --pink: #FFDCEB;
  --lilac: #E6DEFF;
  --sky: #DDE8FF;
  --butter: #FFF3C7;
  --go: #1E9E63;
  --go-soft: #D5F2E3;
  --stop: #E0456B;
  --stop-soft: #FFDCE4;
  --shadow: 0 10px 34px rgba(64, 40, 140, .12);
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --brand: "Fredoka", "Plus Jakarta Sans", system-ui, sans-serif;
  --r-lg: 28px;
  --r: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #110D20; --blob-1: #3B2A86; --blob-2: #6A2556; --blob-3: #1F3A78;
    --glass: rgba(34, 27, 62, .55); --glass-strong: rgba(40, 32, 72, .82); --glass-border: rgba(255, 255, 255, .09);
    --solid: #231C40; --sunken: rgba(255, 255, 255, .06); --ink: #F2EEFF; --muted: #A9A1C7; --line: rgba(255, 255, 255, .1);
    --btn: #F2EEFF; --btn-ink: #160F2C; --accent: #FF6FA8; --accent-soft: #4A2140; --violet: #A594FF; --violet-soft: #2E2758;
    --mint: #1C3B30; --peach: #3D2C22; --pink: #43213A; --lilac: #2E2758; --sky: #1E2C4C; --butter: #3B3420;
    --go: #4FD596; --go-soft: #1C3B30; --stop: #FF7D98; --stop-soft: #4A1F2C; --shadow: 0 10px 34px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #110D20; --blob-1: #3B2A86; --blob-2: #6A2556; --blob-3: #1F3A78;
  --glass: rgba(34, 27, 62, .55); --glass-strong: rgba(40, 32, 72, .82); --glass-border: rgba(255, 255, 255, .09);
  --solid: #231C40; --sunken: rgba(255, 255, 255, .06); --ink: #F2EEFF; --muted: #A9A1C7; --line: rgba(255, 255, 255, .1);
  --btn: #F2EEFF; --btn-ink: #160F2C; --accent: #FF6FA8; --accent-soft: #4A2140; --violet: #A594FF; --violet-soft: #2E2758;
  --mint: #1C3B30; --peach: #3D2C22; --pink: #43213A; --lilac: #2E2758; --sky: #1E2C4C; --butter: #3B3420;
  --go: #4FD596; --go-soft: #1C3B30; --stop: #FF7D98; --stop-soft: #4A1F2C; --shadow: 0 10px 34px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.mascot { display: block; max-width: 100%; height: auto; overflow: visible; }

/* Céu de fundo */
.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.backdrop i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .9; }
.backdrop i:nth-child(1) { width: 52vw; height: 52vw; left: -12vw; top: -14vw; background: var(--blob-1); }
.backdrop i:nth-child(2) { width: 46vw; height: 46vw; right: -10vw; top: 18vh; background: var(--blob-2); }
.backdrop i:nth-child(3) { width: 50vw; height: 50vw; left: 22vw; bottom: -26vw; background: var(--blob-3); }

/* Vidro */
.glass { background: var(--glass); border: 1px solid var(--glass-border); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%); box-shadow: var(--shadow); }

/* Estrutura */
.shell { position: relative; z-index: 1; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 22px; max-width: 1220px; margin: 0 auto; padding-inline: 16px; padding-block: 18px; }
.side { position: sticky; top: calc(18px + env(safe-area-inset-top, 0px)); align-self: start; border-radius: var(--r-lg); padding: 20px 14px; display: grid; gap: 22px; }
.logo { display: flex; align-items: center; gap: 10px; padding-inline: 6px; }
.logo-mark { flex: none; filter: drop-shadow(0 6px 14px rgba(108, 85, 240, .35)); }
.wordmark { font-family: var(--brand); font-weight: 600; font-size: 28px; letter-spacing: -.01em; line-height: 1; display: inline-flex; align-items: baseline; }
.wordmark .i { position: relative; display: inline-block; }
.wordmark .i::before { content: ""; position: absolute; left: 50%; top: -.36em; width: .32em; height: .26em; transform: translateX(-50%); border-radius: 50% 50% 50% 8%; background: linear-gradient(135deg, #C7B8FF, #FF9ECD 55%, #FFC3A0); }
.logo small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.nav { display: grid; gap: 4px; }
.nav-item { position: relative; display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 11px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); text-align: left; }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.nav-item:hover { color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--btn); color: var(--btn-ink); }
.badge { margin-left: auto; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 7px; }
.side-xp { border-radius: var(--r); padding: 14px; display: grid; gap: 6px; background: var(--glass-strong); }
.side-xp strong { font-size: 22px; font-variant-numeric: tabular-nums; }
.side-xp span { font-size: 13px; color: var(--muted); }
.main { min-width: 0; display: grid; gap: 22px; align-content: start; padding-bottom: 24px; }

@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
  .side { position: fixed; z-index: 10; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); top: auto; border-radius: 26px; padding: 6px; }
  .side .logo, .side .side-xp { display: none; }
  .nav { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
  .nav-item { flex-direction: column; gap: 2px; font-size: 10.5px; padding: 8px 2px; border-radius: 20px; text-align: center; }
  .badge { position: absolute; top: 2px; right: 14%; margin: 0; }
  .mobile-top { display: flex; }
}
.mobile-top { display: none; align-items: center; justify-content: space-between; gap: 10px; }

/* Tipografia */
h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; text-wrap: balance; }
h1 { font-size: clamp(28px, 4.6vw, 42px); }
h2 { font-size: 22px; }
h3 { font-size: 18px; letter-spacing: -.01em; }
p { margin: 0; max-width: 64ch; }
.muted { color: var(--muted); }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.link { border: 0; background: none; padding: 0; color: var(--muted); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.link:hover { color: var(--ink); }
.link svg { width: 16px; height: 16px; }
.stack { display: grid; gap: 12px; min-width: 0; }
.stack-sm { display: grid; gap: 4px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.row.center { justify-content: center; }
.row.end { justify-content: flex-end; }

/* Botões e pílulas */
.btn { border: 0; border-radius: 999px; padding: 13px 24px; font-weight: 700; background: var(--btn); color: var(--btn-ink); display: inline-flex; align-items: center; gap: 8px; transition: transform .12s ease; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 18px; height: 18px; }
.btn-soft { background: var(--glass-strong); color: var(--ink); border: 1px solid var(--glass-border); }
.btn-accent { background: var(--accent); color: #fff; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; background: var(--glass-strong); font-variant-numeric: tabular-nums; }
.pill svg { width: 14px; height: 14px; }
.pill-dark { background: var(--btn); color: var(--btn-ink); }
.circle { width: 44px; height: 44px; border-radius: 50%; background: var(--glass-strong); display: grid; place-items: center; flex: none; }
.circle svg { width: 20px; height: 20px; }
.icon-btn { border: 0; background: var(--glass-strong); border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; flex: none; color: var(--ink); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn.slow { font-size: 11px; font-weight: 800; }
.icon-btn.mic { background: var(--accent-soft); color: var(--accent); }
.icon-btn.mic.on { background: var(--accent); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255, 79, 148, .18); } }
.audio { display: inline-flex; gap: 6px; }

/* Superfícies */
.panel { border-radius: var(--r-lg); padding: 22px; display: grid; gap: 16px; min-width: 0; }
.solid { background: var(--solid); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.tone-mint { background: var(--mint); } .tone-peach { background: var(--peach); } .tone-pink { background: var(--pink); }
.tone-lilac { background: var(--lilac); } .tone-sky { background: var(--sky); } .tone-butter { background: var(--butter); }

/* Início */
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.dash { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 1040px) { .dash { grid-template-columns: minmax(0, 1fr); } }
.hero { border-radius: var(--r-lg); padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; overflow: hidden; position: relative; }
.hero .mascot { width: 180px; }
@media (max-width: 560px) { .hero { grid-template-columns: minmax(0, 1fr); } .hero .mascot { width: 140px; justify-self: center; grid-row: 1; } }
.bubble { background: var(--solid); border-radius: 18px 18px 18px 6px; padding: 12px 16px; font-weight: 600; justify-self: start; max-width: 42ch; box-shadow: var(--shadow); }
.side-col { display: grid; gap: 20px; align-content: start; }
.activity { padding: 20px; display: grid; gap: 12px; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; }
.bars div { display: grid; justify-items: center; gap: 6px; height: 100%; align-content: end; }
.bars b { width: 12px; border-radius: 99px; background: var(--accent); min-height: 6px; }
.bars b.soft { background: var(--accent-soft); }
.bars span { font-size: 11px; color: var(--muted); font-weight: 600; }
.ring-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ring-card { border-radius: var(--r); padding: 16px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.ring { width: 92px; height: 92px; }
.ring-track { stroke: var(--sunken); }
.ring-fill { stroke: var(--violet); }
.ring-value { font-weight: 800; font-size: 19px; fill: var(--ink); font-variant-numeric: tabular-nums; }
.ring-card span { font-size: 13px; font-weight: 600; color: var(--muted); }
.continue { border: 0; border-radius: 24px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--btn); color: var(--btn-ink); }
.continue .circle { background: var(--btn-ink); color: var(--btn); }
.continue strong { display: block; }
.continue small { opacity: .7; font-size: 13px; }
.continue .arrow { margin-left: auto; width: 22px; height: 22px; flex: none; }
.timeline { padding: 20px; display: grid; gap: 10px; }
.tl-row { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center; border: 0; background: none; text-align: left; padding: 0; }
.tl-ep { font-size: 12px; font-weight: 700; color: var(--muted); }
.tl-bar { position: relative; border-radius: 999px; background: var(--sunken); min-height: 38px; display: flex; align-items: center; padding: 0 14px; overflow: hidden; font-weight: 600; font-size: 14px; }
.tl-bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
.tl-bar > span { position: relative; display: flex; justify-content: space-between; gap: 10px; width: 100%; min-width: 0; }
.tl-bar > span em { font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-bar > span b { font-variant-numeric: tabular-nums; flex: none; }
.tl-row.now .tl-bar { outline: 2px solid var(--violet); outline-offset: 2px; }

/* Curso */
.season { display: grid; gap: 14px; }
.season-head { display: grid; gap: 6px; }
.ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.ep { border: 1px solid var(--glass-border); text-align: left; border-radius: var(--r-lg); padding: 18px; display: grid; gap: 6px; align-content: start; transition: transform .15s ease; background: var(--glass); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); box-shadow: var(--shadow); }
.ep:hover { transform: translateY(-3px); }
.ep-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ep-num { font-family: var(--brand); font-weight: 600; font-size: 30px; line-height: 1; }
.ep p { font-size: 14px; color: var(--muted); }
.ep .row { margin-top: 6px; }
.dots { display: flex; gap: 4px; margin-top: 4px; }
.dots i { flex: 1; max-width: 26px; height: 6px; border-radius: 99px; background: var(--sunken); }
.dots i.on { background: var(--accent); }
.cast { display: flex; gap: 10px; flex-wrap: wrap; }
.who { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 4px 12px 4px 4px; background: var(--glass-strong); font-size: 13px; font-weight: 600; }
.avatar-i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; color: var(--ink); }

/* Unidade */
.back { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--glass-border); background: var(--glass-strong); border-radius: 999px; padding: 8px 16px 8px 10px; font-weight: 600; justify-self: start; }
.back svg { width: 18px; height: 18px; }
.cover { border-radius: var(--r-lg); padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.cover .mascot { width: 120px; }
@media (max-width: 560px) { .cover { grid-template-columns: minmax(0, 1fr); } .cover .mascot { display: none; } }
.steps { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
.step { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--glass-border); background: var(--glass); border-radius: 999px; padding: 6px 16px 6px 6px; font-weight: 600; white-space: nowrap; }
.step-n { width: 28px; height: 28px; border-radius: 50%; background: var(--glass-strong); display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.step-n svg { width: 15px; height: 15px; }
.step.done .step-n { background: var(--go-soft); color: var(--go); }
.step[aria-current="step"] { background: var(--btn); color: var(--btn-ink); }
.step[aria-current="step"] .step-n { background: var(--btn-ink); color: var(--btn); }

/* Episódio */
.scene { display: flex; gap: 12px; align-items: flex-start; background: var(--sunken); border-radius: 18px; padding: 12px 16px; }
.scene svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
.lines { display: grid; gap: 10px; }
.line { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: start; border-radius: 18px; padding: 8px; transition: background .2s ease; }
.line.right { grid-template-columns: auto minmax(0, 1fr) 38px; }
.line.right .line-av { order: 3; } .line.right .line-txt { order: 2; text-align: right; } .line.right .audio { order: 1; }
.line.playing { background: var(--accent-soft); }
.line-av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; }
.line-txt { display: grid; gap: 2px; min-width: 0; }
.line-txt small { font-size: 12px; font-weight: 700; color: var(--muted); }
.line-txt strong { font-size: 17px; font-weight: 600; }
.line-txt span { font-size: 14px; color: var(--muted); }
.quiz-inline { display: grid; gap: 10px; }

/* Palavras e pronúncia */
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); background: var(--sunken); border-radius: 14px; padding: 10px 14px; }
.legend b { color: var(--ink); }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.word { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--solid); border-radius: 18px; padding: 12px 12px 12px 16px; box-shadow: 0 2px 10px rgba(64, 40, 140, .06); }
.word strong { font-size: 17px; display: block; }
.word .pt { font-size: 14px; color: var(--muted); display: block; }
.pron { display: inline-block; margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--violet); background: var(--violet-soft); border-radius: 8px; padding: 1px 8px; letter-spacing: .02em; }
.mic-result { grid-column: 1 / -1; font-size: 14px; display: grid; gap: 4px; padding: 8px 12px; border-radius: 12px; background: var(--sunken); }
.mic-result .heard { display: flex; flex-wrap: wrap; gap: 4px; }
.mic-result .heard span { padding: 1px 7px; border-radius: 6px; font-weight: 700; }
.mic-result .ok { background: var(--go-soft); color: var(--go); }
.mic-result .miss { background: var(--stop-soft); color: var(--stop); }

/* Gramática */
.why { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; border-radius: var(--r-lg); padding: 18px 20px; }
.why .mascot { width: 84px; }
.parts { display: grid; gap: 14px; }
.part { background: var(--solid); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; box-shadow: 0 2px 10px rgba(64, 40, 140, .06); }
.part-head { display: flex; align-items: center; gap: 12px; }
.part-n { width: 34px; height: 34px; border-radius: 12px; background: var(--violet-soft); color: var(--violet); display: grid; place-items: center; font-weight: 800; flex: none; }
.example { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; background: var(--sunken); border-radius: 14px; padding: 10px 10px 10px 14px; }
.example strong { font-weight: 700; display: block; }
.example small { color: var(--muted); font-size: 14px; }
.explain-more { background: var(--lilac); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; font-size: 15px; }
.mistakes { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.mistakes li { background: var(--solid); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; }
.mistakes .wrong { text-decoration: line-through; color: var(--stop); font-weight: 600; }
.mistakes .right { color: var(--go); font-weight: 700; }
.mistakes small { color: var(--muted); font-size: 14px; }
.tip { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; border-radius: var(--r); padding: 14px 18px; background: var(--butter); }
.tip .mascot { width: 64px; }

/* Prática e testes */
.quiz { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 20px; align-items: start; }
@media (max-width: 780px) { .quiz { grid-template-columns: minmax(0, 1fr); } .quiz-side { display: none; } }
.quiz-side { display: grid; justify-items: center; gap: 10px; border-radius: var(--r-lg); padding: 20px; }
.bar { height: 8px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), var(--accent)); border-radius: 99px; }
.q-text { font-size: 23px; font-weight: 800; letter-spacing: -.015em; }
.options { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--solid); border-radius: 18px; padding: 14px 16px; font-weight: 600; }
.opt:hover:not(:disabled) { border-color: var(--violet); }
.opt.right { background: var(--go-soft); border-color: var(--go); }
.opt.wrong { background: var(--stop-soft); border-color: var(--stop); }
.opt:disabled { cursor: default; }
.feedback { border-radius: 16px; padding: 12px 14px; display: grid; gap: 6px; }
.feedback.ok { background: var(--go-soft); }
.feedback.bad { background: var(--stop-soft); }
.answer { font-weight: 700; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.explain { background: var(--sunken); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.result { display: grid; justify-items: center; text-align: center; gap: 12px; }
.result-level { font-family: var(--brand); font-size: 68px; font-weight: 600; line-height: 1; }
.field { width: 100%; border: 2px solid var(--line); background: var(--solid); border-radius: 16px; padding: 12px 14px; outline: none; }
.field:focus { border-color: var(--violet); }
.area { min-height: 160px; resize: vertical; line-height: 1.5; }
.tiles, .built { display: flex; flex-wrap: wrap; gap: 8px; }
.built { min-height: 60px; border: 2px dashed var(--line); border-radius: 18px; padding: 10px; align-items: center; }
.built.ok { border: 2px solid var(--go); background: var(--go-soft); }
.built.bad { border: 2px solid var(--stop); background: var(--stop-soft); }
.tile { border: 2px solid var(--line); background: var(--solid); border-radius: 12px; padding: 7px 12px; font-weight: 600; }
.tile:disabled { opacity: .3; cursor: default; }
.built .tile:disabled { opacity: 1; }
.speak-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.speak-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--solid); border-radius: 16px; padding: 10px 10px 10px 16px; }
.task { display: flex; gap: 10px; align-items: flex-start; background: var(--peach); border-radius: 16px; padding: 12px 16px; font-weight: 600; }
.task svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
.model { background: var(--sunken); border-radius: 14px; padding: 12px 14px; }
.correction { display: grid; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
.mission-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }

/* Revisão */
.flash { min-height: 190px; border-radius: var(--r-lg); background: var(--solid); display: grid; place-items: center; align-content: center; gap: 12px; text-align: center; padding: 24px; box-shadow: var(--shadow); }
.flash-front { font-size: 32px; font-weight: 800; letter-spacing: -.02em; display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.flash-back { font-size: 20px; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
.flash.flipped { background: var(--mint); }

/* Pronúncia */
.sound-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.sound { border: 1px solid var(--glass-border); text-align: left; border-radius: var(--r-lg); padding: 18px; display: grid; gap: 8px; background: var(--glass); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); box-shadow: var(--shadow); }
.sound-big { font-family: var(--brand); font-size: 34px; font-weight: 600; line-height: 1; background: linear-gradient(135deg, var(--violet), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.how { margin: 0; padding: 0; list-style: none; counter-reset: how; display: grid; gap: 8px; }
.how li { counter-increment: how; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.how li::before { content: counter(how); width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.pair-game { display: grid; gap: 14px; justify-items: center; text-align: center; }
.big-play { width: 92px; height: 92px; border-radius: 50%; border: 0; background: linear-gradient(135deg, var(--violet), var(--accent)); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(255, 79, 148, .35); }
.big-play svg { width: 38px; height: 38px; }
.pair-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: min(420px, 100%); }
.pair-opts .opt { text-align: center; font-size: 20px; }

/* Professor */
.seg { display: flex; flex-wrap: wrap; gap: 6px; border-radius: 999px; padding: 6px; justify-self: start; }
.seg-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 600; color: var(--muted); }
.seg-btn svg { width: 18px; height: 18px; }
.seg-btn[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--glass-border); background: var(--glass); border-radius: 999px; padding: 8px 16px 8px 10px; font-weight: 600; }
.chip svg { width: 18px; height: 18px; }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.chat-wrap { border-radius: var(--r-lg); padding: 18px; display: grid; gap: 14px; }
.chat { display: grid; gap: 12px; }
.msg { max-width: min(560px, 88%); padding: 12px 16px; border-radius: 22px; display: grid; gap: 4px; }
.msg-them { background: var(--solid); justify-self: start; border-bottom-left-radius: 6px; }
.msg-me { background: var(--btn); color: var(--btn-ink); justify-self: end; border-bottom-right-radius: 6px; }
.msg-who { font-size: 12px; font-weight: 700; opacity: .7; }
.msg-pt { font-size: 14px; color: var(--muted); }
.msg details summary { cursor: pointer; list-style: none; }
.msg-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.fb { justify-self: end; max-width: min(560px, 88%); display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: start; }
.fb.left { justify-self: start; }
.fb-body { border-radius: 18px; padding: 10px 14px; font-size: 15px; display: grid; gap: 6px; }
.fb-ok .fb-body { background: var(--mint); }
.fb-fix .fb-body { background: var(--pink); }
.fb-better { font-weight: 700; }
.fb .example { background: var(--glass-strong); }
.avatar { width: 46px; height: 46px; border-radius: 16px; background: var(--glass-strong); display: grid; place-items: center; overflow: hidden; }
.avatar .mascot { width: 42px; margin-top: 4px; }
.composer { display: flex; gap: 8px; background: var(--solid); border-radius: 999px; padding: 6px; box-shadow: var(--shadow); }
.composer input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 14px; outline: none; }
.composer:focus-within { outline: 2px solid var(--violet); }
.notice { font-size: 14px; color: var(--stop); }
.thinking { color: var(--muted); font-style: italic; }
.hint { background: var(--butter); border-radius: 18px; padding: 12px 16px; font-size: 15px; }
.start-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.start-card .mascot { width: 130px; }
@media (max-width: 560px) { .start-card { grid-template-columns: minmax(0, 1fr); } .start-card .mascot { justify-self: center; } }
.foot { font-size: 13px; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) {
  .msg, .fb { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
  .hero .mascot, .float { animation: bob 3.4s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
}
@media (prefers-reduced-motion: reduce) { .ep, .btn { transition: none; } .icon-btn.mic.on { animation: none; } }

// Bubi: um balão de fala fofinho, em degradê com reflexo de vidro.
// A marca registrada dele é o acento agudo (´) no topo da cabeça.
//   mascot(mood, size)  → mood: "wave" | "think" | "talk" | "cheer"
//   logoMark(size)      → o símbolo do app (Bubi dentro do ícone de vidro escuro)

let __bubiSeq = 0;

function bubiDefs(id) {
  return `<defs>
    <linearGradient id="${id}b" x1="0.15" y1="0.05" x2="0.9" y2="1">
      <stop offset="0" stop-color="#C7B8FF"/><stop offset="0.45" stop-color="#FF9ECD"/><stop offset="1" stop-color="#FFC3A0"/>
    </linearGradient>
    <radialGradient id="${id}s" cx="0.3" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="${id}r" cx="0.8" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#7FB2FF" stop-opacity=".55"/><stop offset="1" stop-color="#7FB2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="${id}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B5CFF"/><stop offset="1" stop-color="#FF4F9A"/></linearGradient>
    <filter id="${id}g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>`;
}

          </section>
        </div>
        <div class="side-col">
          <section class="activity solid">
            <div class="row between"><h3>Sua semana</h3><span class="pill">${streak()} ${streak() === 1 ? "dia" : "dias"} seguidos</span></div>
            <div class="bars">${days.map((d) => { const v = state.log[d.k] || 0; return `<div title="${v} XP"><b class="${v >= DAILY_GOAL ? "" : "soft"}" style="height:${Math.max(6, (v / max) * 100)}%"></b><span>${d.label}</span></div>`; }).join("")}</div>

  // ---------- Curso ----------
  function viewCourse() {
    if (ui.unit) return viewUnit();

      ${Object.keys(LEVELS).map((lv) => `

  function viewUnit() {

    const idx = STEPS.findIndex(([k]) => k === ui.step), next = STEPS[idx + 1];

  // Etapa 1: Episódio
  function stepEpisode(u) {
    const e = u.episode, answers = ui.epq[u.id] || {};
    return `<section class="panel glass">
      <div class="section-head"><h2>${esc(e.title)}</h2>

      <div class="scene">${icon("film")}<span>${esc(e.scene)}</span></div>

        return `<button class="opt ${cls}" data-epq="${u.id}:${qi}:${j}" ${picked != null ? "disabled" : ""}>${esc(o)}</button>`; }).join("")}</div></div>`; }).join("")}

      <p class="muted" style="font-size:14px">Para cada palavra: ouça, ouça devagar, repita em voz alta${canListen ? " e toque no microfone para conferir" : ""}. Depois invente uma frase sua com ela.</p>
      <div class="words">${u.vocab.map(([en, pt, pr], i) => `<div class="word">
        <div><strong>${esc(en)}</strong><span class="pt">${esc(pt)}</span><span class="pron">${esc(pr)}</span></div>

  // Etapa 3: Entenda
  function stepLesson(u) {
    const L = u.lesson;
    return `<section class="why tone-lilac">${mascot("talk", 84)}<div class="stack-sm"><span class="label">Pra que serve</span><p style="font-size:17px">${esc(L.why)}</p></div></section>
    <div class="parts">${L.parts.map(([title, text, exs], i) => { const key = u.id + ":" + i, more = ui.more[key]; return `<section class="part">

    <section class="panel glass">

  }
  async function explainAgain(key) {
    const [uid, i] = key.split(":").map(Number), u = unitById(uid), part = u.lesson.parts[i];
    ui.more[key] = { busy: true }; render();
    const prompt = `You are a very patient English teacher for a Brazilian beginner (CEFR ${u.level}) who found this explanation hard to understand.
Topic: ${u.titlePt}. Point: "${part[0]}" — "${part[1]}". Examples given: ${part[2].map((x) => x[0]).join(" | ")}.
Explain the same idea again in Brazilian Portuguese in a DIFFERENT and even simpler way, like talking to a friend: use an everyday analogy or a comparison with Portuguese, short sentences, no technical grammar words (at most 70 words). Then give 2 new, very simple English examples with Portuguese translations.
Reply with only a JSON object: {"explanation_pt":"...","examples":[{"en":"...","pt":"..."}]}`;
    try {
      const d = await tutor.ask(prompt);
      ui.more[key] = { text: String(d.explanation_pt || ""), examples: Array.isArray(d.examples) ? d.examples.slice(0, 3).map((x) => ({ en: String(x.en || ""), pt: String(x.pt || "") })) : [] };
    } catch (e) { if (hideTutor(e)) tutor = null; ui.more[key] = { error: errorText(e) }; }
    render();
  }

  // Etapa 4: Pratique
  function buildPractice(u) {
    const items = [], vocab = u.vocab;
    pick(vocab.map((_, i) => i), 4).forEach((i, k) => {
      const opts = shuffle([vocab[i], ...pick(vocab.filter((_, j) => j !== i), 3)]);
      if (k % 2 === 0) items.push({ type: "mc", label: "O que significa", prompt: vocab[i][0], say: vocab[i][0], options: opts.map((v) => v[1]), answer: opts.indexOf(vocab[i]) });
      else items.push({ type: "mc", label: "Como se diz em inglês", prompt: vocab[i][1], options: opts.map((v) => v[0]), answer: opts.indexOf(vocab[i]), say: vocab[i][0] });
    });
    const sents = u.sentences.map(([raw, pt]) => Object.assign(parseSentence(raw), { pt }));
    const order = shuffle(sents.map((_, i) => i));
    order.slice(0, 4).forEach((i) => { const s = sents[i], opts = shuffle(s.options); items.push({ type: "mc", label: "Complete a frase", prompt: s.blank, sub: s.pt, options: opts, answer: opts.indexOf(s.answer), say: s.full }); });
    order.slice(4, 6).forEach((i) => {
      const words = sents[i].full.split(" ");
      let tiles = shuffle(words.map((w, j) => ({ w, j })));
      if (tiles.every((t, k) => t.j === k)) tiles = tiles.reverse();
      items.push({ type: "order", label: "Monte a frase", sub: sents[i].pt, words, tiles, built: [], say: sents[i].full });
    });
    const line = pick(u.episode.lines.filter((l) => l[1].split(" ").length <= 9), 1)[0];
    if (canSpeak && line) items.push({ type: "dict", label: "Ditado: ouça e escreva", full: line[1], sub: line[2], say: line[1] });
    [order[6], order[7]].forEach((i) => { const s = sents[i]; items.push({ type: "trans", label: "Traduza para o inglês", prompt: s.pt, full: s.full, say: s.full }); });
    return items;
  }
  function startPractice(u, items, extra) { ui.why = {}; ui.practice = { unitId: u.id, items: items || buildPractice(u), i: 0, right: 0, answered: false, correct: null, finished: false, extra: !!extra }; }

  function stepPractice(u) {
    const p = ui.practice && ui.practice.unitId === u.id ? ui.practice : null, s = peekUnit(u.id);
    if (!p) {
      return `<section class="panel glass start-card">${mascot("think", 120)}<div class="stack">
        <h2>Hora de praticar</h2>
        <p>Cerca de 13 exercícios, cada vez diferentes: significado, completar, montar frase, ditado e tradução. Acerte ${PASS}% ou mais para concluir o episódio.${tutor ? ' Errou? Toque em "Por que errei?" e o Bubi explica.' : ""}</p>
        ${s.practice ? `<p class="muted">Seu melhor resultado: <strong>${s.practice}%</strong></p>` : ""}
        <div class="row"><button class="btn" data-practice-start>${s.practice ? "Praticar de novo" : "Começar"}</button></div>
      </div></section>`;
    }
    if (p.finished) {
      const pct = Math.round((p.right / p.items.length) * 100), passed = pct >= PASS;
      return `<section class="panel glass result">${mascot(passed ? "cheer" : "think", 150)}
        <span class="label">${p.extra ? "Exercícios extras" : "Prática concluída"}</span>
        <span class="result-level">${pct}%</span>
        <p>${p.extra ? `Você acertou ${p.right} de ${p.items.length}.` : passed ? "Episódio concluído! As palavras dele entraram na sua revisão." : `Faltou pouco: você precisa de ${PASS}%. Releia a etapa Entenda e tente de novo.`}</p>
        <div class="row center"><button class="btn" data-practice-start>Praticar de novo</button>
        ${tutor ? `<button class="btn btn-soft" data-extra ${ui.extraBusy ? "disabled" : ""}>${icon("spark")}${ui.extraBusy ? "Criando exercícios…" : "+5 exercícios novos com IA"}</button>` : ""}</div>
        ${ui.extraError ? `<p class="notice">${esc(ui.extraError)}</p>` : ""}
      </section>`;
    }
    const it = p.items[p.i];
    let body = "";
    if (it.type === "mc") {
      body = `<span class="q-text">${esc(it.prompt)}</span>${it.sub ? `<span class="muted">${esc(it.sub)}</span>` : ""}
        <div class="options">${it.options.map((o, j) => { const cls = !p.answered ? "" : j === it.answer ? "right" : j === p.picked ? "wrong" : ""; return `<button class="opt ${cls}" data-pick="${j}" ${p.answered ? "disabled" : ""}>${esc(o)}</button>`; }).join("")}</div>`;
    } else if (it.type === "order") {
      const used = new Set(it.built);
      body = `<span class="muted">${esc(it.sub)}</span>
        <div class="built ${p.answered ? (p.correct ? "ok" : "bad") : ""}">${it.built.length ? it.built.map((ti, k) => `<button class="tile" data-unbuild="${k}" ${p.answered ? "disabled" : ""}>${esc(it.tiles[ti].w)}</button>`).join("") : `<span class="muted">Toque nas palavras na ordem certa</span>`}</div>
        <div class="tiles">${it.tiles.map((t, ti) => `<button class="tile" data-build="${ti}" ${used.has(ti) || p.answered ? "disabled" : ""}>${esc(t.w)}</button>`).join("")}</div>
        ${!p.answered ? `<div class="row"><button class="btn" data-check-order ${it.built.length !== it.words.length ? "disabled" : ""}>Verificar</button><button class="link" data-clear-order>Limpar</button></div>` : ""}`;
    } else {
      body = `${it.type === "dict" ? `<div class="row"><button class="btn btn-soft" data-saytext="${esc(it.full)}">${icon("sound")}Ouvir</button><button class="btn btn-soft" data-sayslow="${esc(it.full)}">Ouvir devagar</button></div>` : `<span class="q-text">${esc(it.prompt)}</span>`}
        <input class="field" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escreva em inglês…" ${p.answered ? `disabled value="${esc(p.typed || "")}"` : ""}>
        ${!p.answered ? `<div class="row"><button class="btn" data-check-typed>Verificar</button></div>` : ""}`;
    }
    let feedback = "";
    if (p.answered) {
      const answer = it.type === "mc" ? it.options[it.answer] : it.type === "order" ? it.words.join(" ") : it.full;
      const why = ui.why[p.i];
      feedback = `<div class="feedback ${p.correct ? "ok" : "bad"}">
        <strong>${p.correct ? "Isso aí!" : "A resposta certa é:"}</strong>
        ${!p.correct || it.type !== "mc" ? `<span class="answer">${esc(answer)} ${it.say ? audioBtns(it.say) : ""}</span>` : ""}
        ${it.type === "dict" ? `<span class="muted">${esc(it.sub)}</span>` : ""}
        ${!p.correct && it.type === "trans" ? `<button class="link" data-accept>${icon("check")}Minha resposta também está certa</button>` : ""}
        ${!p.correct && tutor && !why ? `<button class="link" data-why>${icon("help")}Por que errei?</button>` : ""}
        ${why && why.busy ? `<span class="muted">O Bubi está pensando…</span>` : ""}
        ${why && why.text ? `<div class="explain-more"><strong>O Bubi explica:</strong><span>${esc(why.text)}</span></div>` : ""}
        ${why && why.error ? `<span class="notice">${esc(why.error)}</span>` : ""}
      </div>
      <div class="row"><button class="btn" data-next>${p.i + 1 < p.items.length ? "Continuar" : "Ver resultado"}</button></div>`;
    }
    return `<div class="quiz"><section class="panel solid">
        <div class="row between"><span class="label">${esc(it.label)}</span><span class="pill">${p.i + 1} de ${p.items.length}</span></div>
        <div class="bar"><span style="width:${(p.i / p.items.length) * 100}%"></span></div>
        ${body}${feedback}
      </section>
      <aside class="quiz-side glass">${mascot(!p.answered ? "think" : p.correct ? "cheer" : "talk", 150)}${bubbleSay(!p.answered ? "Você consegue!" : p.correct ? "Mandou bem!" : "Errar faz parte. Leia a certa em voz alta!")}</aside>
    </div>`;
  }
  function answerPractice(correct, typed) { const p = ui.practice; p.answered = true; p.correct = correct; p.typed = typed; if (correct) { p.right++; gain(2); } render(); }
  function finishPractice() {
    const p = ui.practice, u = unitById(p.unitId);
    p.finished = true;
    if (!p.extra) {
      const pct = Math.round((p.right / p.items.length) * 100), s = unitState(u.id);

      if (pct >= PASS && !s.done) {
        s.done = true; gain(10);
        u.vocab.forEach((_, i) => { const k = u.id + ":" + i; if (!state.srs[k]) state.srs[k] = { box: 0, due: addDays(1) }; });
      }

  }
  async function whyWrong() {
    const p = ui.practice, it = p.items[p.i], u = unitById(p.unitId), idx = p.i;
    ui.why[idx] = { busy: true }; render();

Topic: ${u.title} (${u.titlePt}).
Rules being practiced:
${u.lesson.parts.map((g) => "- " + g[0] + ": " + g[1]).join("\n")}
Useful vocabulary: ${u.vocab.map((v) => v[0]).join(", ")}.
Each "sentence" contains "___" exactly once; "options" has exactly 3 short choices with only one correct; "answer" is the index of the correct option; "pt" is the Brazilian Portuguese translation of the complete sentence. Do not repeat these sentences: ${u.sentences.map((s) => parseSentence(s[0]).full).join(" | ")}.

    try {

${text.slice(0, 4000)}

  // ---------- Revisão ----------
  function cardOf(key) { const [uid, i] = key.split(":"); const u = unitById(+uid); return { key, unit: u, en: u.vocab[+i][0], pt: u.vocab[+i][1], pron: u.vocab[+i][2], box: state.srs[key].box }; }

    }).join("");
    return `${chips}<section class="chat-wrap glass">
      <div class="chat" aria-live="polite">${msgs}${pr.busy ? `<p class="thinking">Escrevendo…</p>` : ""}<span id="chat-end"></span></div>
      ${pr.error ? `<p class="notice">${esc(pr.error)}</p>` : ""}
      ${pr.hint ? `<div class="hint"><strong>Dica do Bubi:</strong> ${esc(pr.hint)}</div>` : ""}
      <form class="composer" data-form="chat"><input id="chat-input" autocomplete="off" placeholder="Escreva em inglês…" ${pr.busy ? "disabled" : ""} aria-label="Sua mensagem"><button class="btn" ${pr.busy ? "disabled" : ""}>Enviar</button></form>
      <div class="row"><button class="btn btn-soft" data-hint ${pr.busy || !pr.lastHint ? "disabled" : ""}>Preciso de uma dica</button><button class="link" data-prof-reset ${pr.busy ? "disabled" : ""}>Recomeçar</button>${pr.custom ? `<button class="link" data-unit="${pr.custom.unitId}">${icon("back")}Voltar ao episódio</button>` : ""}</div>
    </section>`;
  }
  function profDoubt() {
    const pr = ui.prof;
    const msgs = pr.turns.map((t) => t.role === "me" ? `<div class="msg msg-me"><span>${esc(t.text)}</span></div>`
      : `<div class="fb fb-ok left"><span class="avatar">${mascot("talk", 42)}</span><div class="fb-body"><span>${esc(t.text)}</span>${(t.examples || []).map((x) => `<div class="example"><span><strong>${esc(x.en)}</strong><small>${esc(x.pt)}</small></span>${audioBtns(x.en)}</div>`).join("")}</div></div>`).join("");
    return `<section class="chat-wrap glass">
      ${!pr.turns.length ? `<div class="start-card">${mascot("think", 100)}<div class="stack"><h2>Pergunte qualquer coisa</h2><p class="muted">Em português mesmo, do jeito que vier. Exemplos: "Quando uso since e quando uso for?", "Qual a diferença entre make e do?", "Como se diz 'saudade' em inglês?"</p></div></div>` : ""}
      <div class="chat" aria-live="polite">${msgs}${pr.busy ? `<p class="thinking">O professor está pensando…</p>` : ""}<span id="chat-end"></span></div>
      ${pr.error ? `<p class="notice">${esc(pr.error)}</p>` : ""}
      <form class="composer" data-form="doubt"><input id="chat-input" autocomplete="off" placeholder="Escreva sua dúvida…" value="${esc(pr.draft || "")}" ${pr.busy ? "disabled" : ""} aria-label="Sua dúvida"><button class="btn" ${pr.busy ? "disabled" : ""}>Perguntar</button></form>
      ${pr.turns.length ? `<div class="row"><button class="link" data-prof-reset ${pr.busy ? "disabled" : ""}>Limpar conversa</button></div>` : ""}
    </section>`;
  }
  function profFix() {
    const pr = ui.prof;
    return `<section class="panel glass"><h2>Corrigir texto</h2>
      <p class="muted">Cole ou escreva qualquer texto em inglês: um e-mail, uma legenda do Instagram, uma mensagem. O professor corrige, explica os erros e devolve uma versão natural.</p>
      <textarea class="field area" id="fix-text" placeholder="Escreva aqui em inglês…" ${pr.busy ? "disabled" : ""}>${esc(pr.draft || "")}</textarea>
      <div class="row"><button class="btn" data-fix ${pr.busy ? "disabled" : ""}>${pr.busy ? "Corrigindo…" : "Corrigir"}</button></div>
      ${pr.error ? `<p class="notice">${esc(pr.error)}</p>` : ""}${pr.fix ? correctionView(pr.fix) : ""}</section>`;
  }
  function chatPrompt() {
    const pr = ui.prof, level = levelForAi();
    const scene = pr.custom ? pr.custom.scene : TOPICS.find((t) => t.id === pr.topic).scene;
    const transcript = pr.turns.slice(-12).map((t) => (t.role === "me" ? "Learner: " : "You: ") + t.text).join("\n");
    const lastMe = [...pr.turns].reverse().find((t) => t.role === "me");
    return `You are a friendly English teacher doing a written conversation with a Brazilian learner who speaks Portuguese. Learner level (CEFR): ${level}.
Situation: ${scene}

Fields to return:
- "reply": your next line, natural English, 1-3 short sentences, vocabulary suited to ${level}. React to what the learner said and end with a question. Never write Portuguese here.
- "reply_pt": Brazilian Portuguese translation of "reply".
- "feedback_pt": in Brazilian Portuguese, friendly, at most 2 short sentences about the learner's LAST message. Praise if correct and natural; if there's a mistake, explain it very simply. If the learner wrote in Portuguese, encourage her and show how to say it. Use "" if the learner hasn't written yet.
- "correct_version": a natural, corrected English version of the learner's last message, or "" if it was already correct (or there is none).
- "hint_pt": in Portuguese, a suggestion of how to answer your reply, with one short English example in quotes.

${transcript ? "Conversation so far:\n" + transcript : "The conversation has not started. Open with a friendly first line."}
${lastMe ? "\nThe learner's last message is: " + lastMe.text : ""}

Reply with only a JSON object: {"reply":"...","reply_pt":"...","feedback_pt":"...","correct_version":"...","hint_pt":"..."}`;
  }
  function doubtPrompt() {
    const history = ui.prof.turns.slice(-8).map((t) => (t.role === "me" ? "Learner: " : "Teacher: ") + t.text).join("\n");
    return `You are a very patient English teacher for a Brazilian learner (CEFR ${levelForAi()}). Answer the learner's latest question in Brazilian Portuguese, clearly and simply, like explaining to a friend who is starting from zero (at most about 120 words, short sentences, compare with Portuguese when it helps, never use a technical term without an example). Then give 2 or 3 short English examples with Portuguese translations. If the question is not about English or language learning, answer kindly in one sentence and bring the focus back to English.
Conversation:
${history}

Reply with only a JSON object: {"answer_pt":"...","examples":[{"en":"...","pt":"..."}]}`;
  }
  async function profSend(kind) {
    const pr = ui.prof, mine = pr;
    pr.busy = true; pr.error = ""; pr.hint = ""; render();
    try {
      if (kind === "chat") {
        const data = await tutor.ask(chatPrompt());
        if (ui.prof !== mine) return;
        const lastMe = [...pr.turns].reverse().find((t) => t.role === "me");
        if (lastMe && !lastMe.fb) {
          lastMe.fb = String(data.feedback_pt || "Muito bem!");
          const better = String(data.correct_version || "").trim();
          lastMe.better = better && normalize(better) !== normalize(lastMe.text) ? better : "";
        }
        pr.turns.push({ role: "them", text: String(data.reply || "Sorry, could you say that again?"), pt: String(data.reply_pt || "") });
        pr.lastHint = String(data.hint_pt || "");
        if (lastMe) {
          gain(3);
          if (pr.custom && pr.turns.filter((t) => t.role === "me").length >= 3) { const s = unitState(pr.custom.unitId); if (!s.mission) { s.mission = true; gain(10); } }
        }
      } else {
        const data = await tutor.ask(doubtPrompt());
        if (ui.prof !== mine) return;
        pr.turns.push({ role: "them", text: String(data.answer_pt || ""), examples: Array.isArray(data.examples) ? data.examples.slice(0, 4).map((x) => ({ en: String(x.en || ""), pt: String(x.pt || "") })) : [] });
        gain(1);
      }
    } catch (e) { if (hideTutor(e)) tutor = null; pr.error = errorText(e); }
    finally { pr.busy = false; if (ui.prof === mine) { render(); const input = document.getElementById("chat-input"); if (input) input.focus(); } }
  }
  async function profFixRun() {
    const pr = ui.prof, text = (document.getElementById("fix-text").value || "").trim();
    pr.draft = text; pr.error = ""; pr.fix = null;
    if (text.split(/\s+/).length < 3) { pr.error = "Escreva pelo menos uma frase completa."; render(); return; }
    pr.busy = true; render();
    try { pr.fix = await tutor.ask(fixPrompt(text, "")); gain(3); }
    catch (e) { if (hideTutor(e)) tutor = null; pr.error = errorText(e); }
    finally { pr.busy = false; render(); }
  }

  // ---------- Navegação ----------
  function stopAudio() { if (canSpeak) try { speechSynthesis.cancel(); } catch (e) { /* ok */ } ui.playing = null; }
  function go(tab) {
    stopAudio(); ui.mic = null;
    ui.tab = tab;
    if (tab === "curso") ui.unit = null;
    if (tab === "pronuncia") { ui.pron = null; ui.game = null; }
    if (tab === "revisao") ui.review = ui.review && ui.review.i < ui.review.keys.length ? ui.review : null;
    if (tab === "teste" && ui.test && ui.test.i >= PLACEMENT.length) ui.test = null;
    render(); window.scrollTo(0, 0);
  }
  function openUnit(id) {
    stopAudio(); ui.mic = null; ui.showModel = false;
    ui.tab = "curso"; ui.unit = id;
    const d = stepDone(id);
    ui.step = STEPS.map(([k]) => k).find((k) => !d[k]) || "episode";
    markSeen(id, ui.step);
    if (!ui.practice || ui.practice.unitId !== id) ui.practice = null;
    render(); window.scrollTo(0, 0);
  }
  function markSeen(id, step) {
    if (step !== "vocab" && step !== "lesson") return;
    const s = unitState(id);
    if (!s.seen[step]) { s.seen[step] = true; gain(2); }
  }

  // ---------- Eventos ----------
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("button");
    if (!el || el.disabled) return;
    const d = el.dataset, u = ui.unit ? unitById(ui.unit) : null;

    if (d.tab) return go(d.tab);
    if (d.go) return go(d.go);
    if (d.unit) return openUnit(+d.unit);
    if ("startZero" in d) { state.placement = { score: null, level: "A1", start: 1 }; save(); return openUnit(1); }
    if (d.step && u) { stopAudio(); ui.mic = null; ui.step = d.step; markSeen(u.id, d.step); render(); window.scrollTo(0, 0); return; }

    // áudio e microfone
    if (d.saytext) return speak(d.saytext);
    if (d.sayslow) return speak(d.sayslow, 0.6);
    if (d.sayline) { const [uid, i] = d.sayline.split(":").map(Number), l = unitById(uid).episode.lines[i]; if (canSpeak) { speechSynthesis.cancel(); speechSynthesis.speak(utter(l[1], { pitch: (CAST[l[0]] || {}).pitch })); } return; }
    if ("sayall" in d && u) return speakAll(u.vocab.map((v) => v[0]));
    if ("playEpisode" in d && u) { if (ui.playing) { stopAudio(); markLine(-1); } else playLines(u.episode.lines); el.innerHTML = icon(ui.playing ? "stop" : "play") + (ui.playing ? "Parar" : "Ouvir o episódio"); return; }
    if (d.listen) return listen(d.target, d.listen);

    // episódio
    if ("togglePt" in d) { ui.showPt = !ui.showPt; render(); return; }
    if (d.epq) {
      const [uid, qi, j] = d.epq.split(":").map(Number), ans = ui.epq[uid] || (ui.epq[uid] = {});
      if (ans[qi] != null) return;
      ans[qi] = j;
      const unit = unitById(uid);
      if (j === unit.episode.questions[qi][2]) gain(2);
      if (Object.keys(ans).length === unit.episode.questions.length) { const s = unitState(uid); if (!s.seen.episode) { s.seen.episode = true; gain(3); } }
      render(); return;
    }

    // entenda
    if (d.more && tutor) return explainAgain(d.more);
    if ("doubt" in d && u) { ui.prof = newProf("doubt"); ui.prof.draft = `Pode me explicar de um jeito bem simples: ${u.titlePt.toLowerCase()}?`; return go("professor"); }

    // prática
    const p = ui.practice;
    if ("practiceStart" in d && u) { startPractice(u); render(); return; }
    if ("extra" in d && u && tutor) return extraExercises(u);
    if (d.pick != null && p && !p.answered) { p.picked = +d.pick; return answerPractice(+d.pick === p.items[p.i].answer); }
    if (d.build != null && p && !p.answered) { p.items[p.i].built.push(+d.build); render(); return; }
    if (d.unbuild != null && p && !p.answered) { p.items[p.i].built.splice(+d.unbuild, 1); render(); return; }
    if ("clearOrder" in d && p) { p.items[p.i].built = []; render(); return; }
    if ("checkOrder" in d && p) { const it = p.items[p.i]; return answerPractice(it.built.map((ti) => it.tiles[ti].w).join(" ") === it.words.join(" ")); }
    if ("checkTyped" in d && p) { const it = p.items[p.i], typed = (document.getElementById("typed").value || "").trim(); if (!typed) return; return answerPractice(normalize(typed) === normalize(it.full), typed); }
    if ("accept" in d && p && !p.correct) { p.correct = true; p.right++; gain(2); render(); return; }
    if ("why" in d && p && tutor) return whyWrong();
    if ("next" in d && p) {
      if (p.i + 1 >= p.items.length) return finishPractice();
      p.i++; p.answered = false; p.correct = null; p.picked = null; p.typed = "";
      render(); const f = document.getElementById("typed"); if (f) f.focus(); return;
    }

    // fala e missão
    if ("speakDone" in d && u) { const s = unitState(u.id); if (!s.speak) { s.speak = true; gain(5); } render(); return; }
    if (d.roleplay) { const unit = unitById(+d.roleplay), who = unit.episode.lines.find((l) => l[0] !== "Bia")[0]; ui.prof = newProf("chat"); ui.prof.custom = { unitId: unit.id, name: unit.episode.title, goal: unit.mission.goal, scene: unit.mission.roleplay, who }; return go("professor"); }
    if ("writeCheck" in d && u && tutor) return checkWriting(u);
    if ("writeSelf" in d && u) { const w = ui.write[u.id] || (ui.write[u.id] = {}); w.text = document.getElementById("write-text").value; const s = unitState(u.id); if (!s.mission) { s.mission = true; gain(5); } render(); return; }
    if ("showModel" in d) { ui.showModel = !ui.showModel; render(); return; }

    // pronúncia
    if (d.pron) { ui.pron = d.pron; ui.game = null; ui.mic = null; render(); window.scrollTo(0, 0); return; }
    if ("pronBack" in d) { ui.pron = null; ui.game = null; ui.mic = null; render(); return; }
    if (d.pronDone) { if (!state.pron[d.pronDone]) { state.pron[d.pronDone] = true; gain(5); } render(); return; }
    if ("gameStart" in d && ui.pron) {
      const x = PRONUNCIATION.find((y) => y.id === ui.pron);
      ui.game = { id: x.id, i: 0, right: 0, picked: null, rounds: [...Array(6)].map(() => ({ pair: shuffle(pick(x.pairs, 1)[0]), answer: Math.random() < 0.5 ? 0 : 1 })) };
      render(); const r = ui.game.rounds[0]; speak(r.pair[r.answer], 0.8); return;
    }
    if ("gamePlay" in d && ui.game) { const r = ui.game.rounds[ui.game.i]; return speak(r.pair[r.answer], 0.8); }
    if (d.gamePick != null && ui.game && ui.game.picked == null) { const g = ui.game; g.picked = +d.gamePick; if (g.picked === g.rounds[g.i].answer) { g.right++; gain(1); } render(); return; }
    if ("gameNext" in d && ui.game) {
      const g = ui.game; g.i++; g.picked = null;
      if (g.i >= g.rounds.length && g.right >= 5 && !state.pron[g.id]) { state.pron[g.id] = true; gain(5); }
      render(); if (g.i < g.rounds.length) { const r = g.rounds[g.i]; speak(r.pair[r.answer], 0.8); } return;
    }

    // revisão
    if ("reviewStart" in d) { ui.review = { keys: shuffle(dueCards()).slice(0, 25), i: 0, right: 0, flipped: false }; render(); return; }
    if ("flip" in d && ui.review) { ui.review.flipped = true; const c = cardOf(ui.review.keys[ui.review.i]); speak(c.en); render(); return; }
    if (d.recall != null && ui.review) {
      const r = ui.review, card = state.srs[r.keys[r.i]];
      if (d.recall === "1") { card.box = Math.min(card.box + 1, SRS_DAYS.length - 1); card.due = addDays(SRS_DAYS[card.box]); r.right++; }
      else { card.box = 0; card.due = addDays(1); }
      if (state.reviewed.date !== today()) state.reviewed = { date: today(), n: 0 };
      state.reviewed.n++; gain(1);
      r.i++; r.flipped = false; render(); return;
    }
    if ("reviewClose" in d) { ui.review = null; render(); return; }

    // teste de nível
    if ("testStart" in d) { ui.test = { i: 0, score: 0, picked: null }; render(); return; }
    if (d.tpick != null && ui.test && ui.test.picked == null) { ui.test.picked = +d.tpick; if (+d.tpick === PLACEMENT[ui.test.i].answer) ui.test.score++; render(); return; }
    if ("tnext" in d && ui.test) {
      ui.test.i++; ui.test.picked = null;
      if (ui.test.i >= PLACEMENT.length) { const res = placementResult(ui.test.score); state.placement = { score: ui.test.score, level: res.level, start: res.start, taken: true }; gain(20); }
      render(); return;
    }

    // professor
    if (d.mode && !ui.prof.busy) { ui.prof = newProf(d.mode, ui.prof.topic); render(); return; }
    if (d.topic && !ui.prof.busy) { ui.prof = newProf("chat", d.topic); render(); return; }
    if ("profFree" in d && !ui.prof.busy) { ui.prof = newProf("chat"); render(); return; }
    if ("chatStart" in d && tutor) return profSend("chat");
    if ("profReset" in d) { const c = ui.prof.custom; ui.prof = newProf(ui.prof.mode, ui.prof.topic); ui.prof.custom = c; render(); return; }
    if ("hint" in d) { ui.prof.hint = ui.prof.lastHint || ""; render(); return; }
    if ("fix" in d && tutor) return profFixRun();
  });

  document.addEventListener("input", (ev) => {
    const id = ev.target.id;
    if (id === "write-text" && ui.unit) { (ui.write[ui.unit] || (ui.write[ui.unit] = {})).text = ev.target.value; }
    else if (id === "fix-text" || (id === "chat-input" && ui.prof.mode === "doubt")) ui.prof.draft = ev.target.value;
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && ev.target.id === "typed") { ev.preventDefault(); const b = document.querySelector("[data-check-typed]"); if (b) b.click(); }
  });
  document.addEventListener("submit", (ev) => {
    const kind = ev.target.dataset.form;
    if (!kind) return;
    ev.preventDefault();
    const text = (document.getElementById("chat-input").value || "").trim();
    if (!text || ui.prof.busy || !tutor) return;
    ui.prof.turns.push({ role: "me", text }); ui.prof.draft = "";
    profSend(kind);
  });
  if (canSpeak) try { speechSynthesis.getVoices(); } catch (e) { /* ok */ }

  // ---------- Início ----------
  render();
  (async () => {
    store = await initStore();
    try { const saved = await store.load(); if (saved && typeof saved === "object" && saved.v === 3) state = Object.assign(emptyState(), saved); } catch (e) { /* começa do zero */ }
    render();
  })();
  initTutor().then((t) => { tutor = t; render(); }).catch(() => { tutor = null; render(); });
})();
</script>
</body>
</html>
