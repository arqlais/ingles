<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inglês de Viagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral (desktop) ou barra inferior (celular) + painel de cartões pastel bem arredondados, botões-pílula pretos e ilustrações em traço. */
:root {
  --bg: #F2F0F5;
  --surface: #FFFFFF;
  --surface-2: #F7F5F9;
  --ink: #151418;
  --muted: #6E6977;
  --line: #E7E2EC;
  --line-strong: #E2DCE8;
  --btn: #151418;
  --btn-ink: #FFFFFF;
  --mint: #DCEFDA;
  --peach: #F6E7D0;
  --pink: #F9D7E6;
  --lilac: #E6DCF2;
  --sky: #D8E8F6;
  --butter: #F5EEC4;
  --pink-strong: #F3A9C8;
  --butter-strong: #F4DB6E;
  --mauve: #8E6A86;
  --go: #2C8A57;
  --go-soft: #DCEFDA;
  --stop: #C24A5C;
  --stop-soft: #F9D7E0;
  --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --r-lg: 28px;
  --r: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141217; --surface: #1F1C24; --surface-2: #26222C; --ink: #F3F0F6; --muted: #A69FB0;
    --line: #322D3A; --line-strong: #3B3544; --btn: #F3F0F6; --btn-ink: #141217;
    --mint: #233A2C; --peach: #3A3023; --pink: #3E2534; --lilac: #2F2841; --sky: #1F2F3F; --butter: #37331D;
    --pink-strong: #E58CB2; --butter-strong: #D9BE4E; --mauve: #CBA6C3;
    --go: #5CC48C; --go-soft: #213A2B; --stop: #EE8394; --stop-soft: #43222A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141217; --surface: #1F1C24; --surface-2: #26222C; --ink: #F3F0F6; --muted: #A69FB0;
  --line: #322D3A; --line-strong: #3B3544; --btn: #F3F0F6; --btn-ink: #141217;
  --mint: #233A2C; --peach: #3A3023; --pink: #3E2534; --lilac: #2F2841; --sky: #1F2F3F; --butter: #37331D;
  --pink-strong: #E58CB2; --butter-strong: #D9BE4E; --mauve: #CBA6C3;
  --go: #5CC48C; --go-soft: #213A2B; --stop: #EE8394; --stop-soft: #43222A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--mauve); outline-offset: 2px; }
.mascot { display: block; max-width: 100%; height: auto; }

/* Estrutura */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 20px; max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px; min-height: 100%; }
.side { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); align-self: start; background: var(--surface); border-radius: var(--r-lg); padding: 22px 14px; display: grid; gap: 22px; }
.logo { display: flex; align-items: center; gap: 8px; padding-inline: 8px; }
.logo-text { font-weight: 800; font-size: 19px; letter-spacing: -.01em; line-height: 1.15; }
.logo-text span { display: block; font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: 0; }
.nav { display: grid; gap: 4px; }
.nav-item { display: flex; align-items: center; gap: 12px; border: 0; background: transparent; padding: 11px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); text-align: left; }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.nav-item[aria-current="page"] { background: var(--btn); color: var(--btn-ink); }
.side-xp { background: var(--lilac); border-radius: var(--r); padding: 14px; display: grid; gap: 2px; }
.side-xp strong { font-size: 22px; font-variant-numeric: tabular-nums; }
.side-xp span { font-size: 13px; color: var(--muted); }
.main { min-width: 0; display: grid; gap: 20px; align-content: start; padding-bottom: 24px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .side { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; top: auto; border-radius: 24px 24px 0 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 24px rgba(20, 18, 24, .08); }
  .side .logo, .side .side-xp { display: none; }
  .nav { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .nav-item { flex-direction: column; gap: 2px; font-size: 11px; padding: 8px 4px; border-radius: 16px; text-align: center; }
}

/* Tipografia */
h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.02em; line-height: 1.12; text-wrap: balance; }
h1 { font-size: clamp(28px, 4.5vw, 40px); }
h2 { font-size: 22px; }
h3 { font-size: 18px; letter-spacing: -.01em; }
p { margin: 0; max-width: 62ch; }
.muted { color: var(--muted); }
.label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.link { border: 0; background: none; padding: 0; color: var(--muted); font-weight: 600; font-size: 14px; }
.link:hover { color: var(--ink); }

/* Botões */
.btn { border: 0; border-radius: 999px; padding: 13px 24px; font-weight: 700; background: var(--btn); color: var(--btn-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-soft { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.btn-wide { width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; background: var(--surface); font-variant-numeric: tabular-nums; }
.pill-dark { background: var(--btn); color: var(--btn-ink); }
.circle { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
.circle svg { width: 20px; height: 20px; }

/* Superfícies */
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 22px; display: grid; gap: 16px; min-width: 0; }
.tone-mint { background: var(--mint); } .tone-peach { background: var(--peach); } .tone-pink { background: var(--pink); }
.tone-lilac { background: var(--lilac); } .tone-sky { background: var(--sky); } .tone-butter { background: var(--butter); }

/* Início */
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; }
@media (max-width: 1000px) { .home-grid { grid-template-columns: minmax(0, 1fr); } }
.hero { background: var(--pink); border-radius: var(--r-lg); padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; right: -40px; top: -40px; width: 260px; height: 260px; border-radius: 50%; background: var(--surface); opacity: .45; }
.hero > * { position: relative; }
.hero .mascot { width: 170px; }
@media (max-width: 560px) { .hero { grid-template-columns: minmax(0, 1fr); } .hero .mascot { width: 130px; justify-self: center; grid-row: 1; } }
.bubble { background: var(--surface); border-radius: 18px 18px 18px 4px; padding: 12px 16px; font-weight: 600; justify-self: start; max-width: 40ch; }

.rings { display: grid; gap: 12px; align-content: start; }
@media (max-width: 1000px) { .rings { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ring-card { background: var(--lilac); border-radius: var(--r); padding: 16px; display: grid; justify-items: center; gap: 6px; text-align: center; }
.ring-card:nth-child(2) { background: var(--mint); } .ring-card:nth-child(3) { background: var(--butter); }
.ring { width: 96px; height: 96px; }
.ring-track { stroke: var(--surface); }
.ring-fill { stroke: var(--ink); transition: stroke-dasharray .4s ease; }
.ring-value { font-weight: 800; font-size: 19px; fill: var(--ink); font-variant-numeric: tabular-nums; }
.ring-card span { font-size: 13px; font-weight: 600; color: var(--muted); }
@media (max-width: 560px) { .ring { width: 72px; height: 72px; } .ring-card { padding: 12px 6px; } }

.continue { background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 22px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; }
.continue .circle { background: var(--btn-ink); color: var(--btn); }
.continue strong { display: block; }
.continue small { opacity: .7; font-size: 13px; }
.continue .arrow { margin-left: auto; width: 22px; height: 22px; }

/* Destinos */
.dest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.dest { border: 0; text-align: left; border-radius: var(--r-lg); padding: 18px; display: grid; gap: 10px; align-content: start; min-height: 190px; transition: transform .15s ease; }
.dest:hover { transform: translateY(-2px); }
.dest h3 { font-size: 20px; }
.dest p { font-size: 14px; color: var(--muted); }
.dest .row { margin-top: auto; gap: 6px; }

/* Frases */
.sit-hero { border-radius: var(--r-lg); padding: 22px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.sit-hero .circle { width: 64px; height: 64px; } .sit-hero .circle svg { width: 30px; height: 30px; }
.phrases { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.phrase { background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.phrase-en { font-weight: 700; font-size: 17px; }
.phrase-pt { color: var(--muted); font-size: 15px; }
.phrase-tip { display: inline-block; margin-top: 6px; font-size: 13px; background: var(--butter); border-radius: 10px; padding: 4px 10px; }
.check { appearance: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-strong); margin: 0; display: grid; place-items: center; cursor: pointer; }
.check:checked { background: var(--btn); border-color: var(--btn); }
.check:checked::after { content: ""; width: 10px; height: 6px; border-left: 2.5px solid var(--btn-ink); border-bottom: 2.5px solid var(--btn-ink); transform: translateY(-1px) rotate(-45deg); }
.icon-btn { border: 0; background: var(--surface-2); border-radius: 50%; width: 42px; height: 42px; display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; }
.back { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--surface); border-radius: 999px; padding: 8px 16px 8px 10px; font-weight: 600; justify-self: start; }
.back svg { width: 18px; height: 18px; }

/* Quiz e teste */
.quiz { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 20px; align-items: start; }
@media (max-width: 760px) { .quiz { grid-template-columns: minmax(0, 1fr); } .quiz-side { display: none; } }
.quiz-side { display: grid; justify-items: center; gap: 10px; background: var(--lilac); border-radius: var(--r-lg); padding: 20px; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.q-text { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.options { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 16px; font-weight: 600; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt.right { background: var(--go-soft); border-color: var(--go); }
.opt.wrong { background: var(--stop-soft); border-color: var(--stop); }
.opt:disabled { cursor: default; }
.explain { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.result { display: grid; justify-items: center; text-align: center; gap: 12px; }
.result-level { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -.03em; }

/* Conversa */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--surface); border-radius: 999px; padding: 8px 16px 8px 10px; font-weight: 600; }
.chip svg { width: 18px; height: 18px; }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.chat-wrap { background: var(--surface); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 14px; }
.chat { display: grid; gap: 12px; }
.msg { max-width: min(560px, 88%); padding: 12px 16px; border-radius: 20px; display: grid; gap: 4px; }
.msg-them { background: var(--surface-2); justify-self: start; border-bottom-left-radius: 6px; }
.msg-me { background: var(--btn); color: var(--btn-ink); justify-self: end; border-bottom-right-radius: 6px; }
.msg-who { font-size: 12px; font-weight: 700; opacity: .7; }
.msg-pt { font-size: 14px; color: var(--muted); }
.msg details summary { cursor: pointer; list-style: none; }
.msg-actions { display: flex; gap: 12px; }
.fb { justify-self: end; max-width: min(560px, 88%); display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: start; }
.fb-body { border-radius: 18px; padding: 10px 14px; font-size: 15px; display: grid; gap: 4px; }
.fb-ok .fb-body { background: var(--mint); }
.fb-fix .fb-body { background: var(--pink); }
.fb-better { font-weight: 700; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--butter); display: grid; place-items: center; overflow: hidden; }
.avatar .mascot { width: 40px; margin-top: 6px; }
.composer { display: flex; gap: 8px; background: var(--surface-2); border-radius: 999px; padding: 6px; }
.composer input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 14px; outline: none; }
.composer:focus-within { outline: 2px solid var(--mauve); }
.notice { font-size: 14px; color: var(--stop); }
.thinking { color: var(--muted); font-style: italic; }
.hint { background: var(--butter); border-radius: 18px; padding: 12px 16px; font-size: 15px; }
.start-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.start-card .mascot { width: 130px; }
@media (max-width: 560px) { .start-card { grid-template-columns: minmax(0, 1fr); } .start-card .mascot { justify-self: center; } }
.foot { font-size: 13px; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) {
  .msg, .fb { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
  .hero .mascot { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
}
@media (prefers-reduced-motion: reduce) { .dest { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo" id="logo"></div>
    <nav class="nav" aria-label="Seções" id="nav"></nav>
    <div class="side-xp" id="side-xp"></div>
  </aside>
  <main class="main" id="app"></main>
</div>
<script>
// Conteúdo da plataforma: situações de viagem, frases e teste de nível.
// Para adicionar uma situação, copie um bloco e mude o código (3 letras).

const SITUATIONS = [
  {
    code: "AIR", color: "sky", name: "Aeroporto", icon: "plane",
    role: "a friendly airline check-in agent at an international airport",
    roleLabel: "Atendente",
    scene: "The learner arrives at the check-in counter with one suitcase and a backpack for an international flight.",
    phrases: [
      { en: "Where is the check-in counter for this airline?", pt: "Onde fica o balcão de check-in desta companhia?" },
      { en: "I'd like a window seat, please.", pt: "Eu gostaria de um assento na janela, por favor.", tip: "I'd = I would. Para corredor, diga aisle seat (o 's' é mudo: 'ail')." },
      { en: "Can I take this bag on board?", pt: "Posso levar esta mala a bordo?" },
      { en: "What time does boarding start?", pt: "Que horas começa o embarque?" },
      { en: "Which gate is it?", pt: "Qual é o portão?" },
      { en: "My flight was delayed.", pt: "Meu voo atrasou." },
      { en: "I missed my connection.", pt: "Perdi minha conexão." },
      { en: "My luggage didn't arrive.", pt: "Minha bagagem não chegou.", tip: "Luggage e baggage não têm plural: nunca 'luggages'." }
    ]
  },
  {
    code: "IMM", color: "lilac", name: "Imigração", icon: "passport",
    role: "a calm but direct immigration officer at passport control",
    roleLabel: "Oficial",
    scene: "The learner has just landed and is at the passport control booth.",
    phrases: [
      { en: "Here is my passport.", pt: "Aqui está meu passaporte." },
      { en: "I'm here on vacation.", pt: "Estou aqui de férias.", tip: "No Reino Unido também se diz on holiday." },
      { en: "I'm staying for ten days.", pt: "Vou ficar dez dias." },
      { en: "I'm staying at a hotel downtown.", pt: "Vou ficar num hotel no centro." },
      { en: "This is my return ticket.", pt: "Esta é minha passagem de volta." },
      { en: "I'm traveling alone.", pt: "Estou viajando sozinha." },
      { en: "Nothing to declare.", pt: "Nada a declarar." },
      { en: "Could you repeat that more slowly, please?", pt: "Pode repetir mais devagar, por favor?", tip: "Frase salva-vidas. Use sempre que não entender alguma coisa." }
    ]
  },
  {
    code: "HTL", color: "peach", name: "Hotel", icon: "bed",
    role: "a polite hotel front desk receptionist",
    roleLabel: "Recepção",
    scene: "The learner arrives at the hotel in the evening to check in.",
    phrases: [
      { en: "I have a reservation under the name Vieira.", pt: "Tenho uma reserva no nome Vieira." },
      { en: "What time is check-out?", pt: "Que horas é o check-out?" },
      { en: "Is breakfast included?", pt: "O café da manhã está incluso?" },
      { en: "What's the Wi-Fi password?", pt: "Qual é a senha do Wi-Fi?", tip: "Em inglês se fala 'uai-fai'." },
      { en: "Can I leave my bags here after check-out?", pt: "Posso deixar minhas malas aqui depois do check-out?" },
      { en: "The air conditioning isn't working.", pt: "O ar-condicionado não está funcionando." },
      { en: "Could I have an extra towel?", pt: "Poderia me dar uma toalha extra?" },
      { en: "Could you call a taxi for me?", pt: "Poderia chamar um táxi para mim?" }
    ]
  },
  {
    code: "FOO", color: "pink", name: "Restaurante", icon: "fork",
    role: "a cheerful waiter at a casual restaurant",
    roleLabel: "Garçom",
    scene: "The learner walks into the restaurant for dinner.",
    phrases: [
      { en: "A table for two, please.", pt: "Uma mesa para dois, por favor." },
      { en: "Can I see the menu?", pt: "Posso ver o cardápio?" },
      { en: "What do you recommend?", pt: "O que você recomenda?" },
      { en: "I'll have the chicken, please.", pt: "Vou querer o frango, por favor.", tip: "I'll have... é o jeito mais natural de pedir comida." },
      { en: "Does this have nuts?", pt: "Isso tem castanhas ou nozes?" },
      { en: "Can I have some water, please?", pt: "Pode me trazer água, por favor?" },
      { en: "Could we have the check, please?", pt: "Pode trazer a conta, por favor?", tip: "Nos EUA é check; no Reino Unido, bill." },
      { en: "Is the tip included?", pt: "A gorjeta está incluída?" }
    ]
  },
  {
    code: "TRN", color: "mint", name: "Transporte", icon: "train",
    role: "a helpful ticket office clerk at a train station",
    roleLabel: "Bilheteria",
    scene: "The learner is at the station ticket office and wants to get somewhere in the city.",
    phrases: [
      { en: "How do I get to the city center?", pt: "Como chego ao centro da cidade?" },
      { en: "Which line goes to the airport?", pt: "Qual linha vai para o aeroporto?" },
      { en: "A one-way ticket, please.", pt: "Uma passagem só de ida, por favor.", tip: "Ida e volta é round-trip (EUA) ou return (Reino Unido)." },
      { en: "Does this bus stop at Central Station?", pt: "Este ônibus para na Estação Central?" },
      { en: "How long does it take?", pt: "Quanto tempo demora?" },
      { en: "Is it far from here?", pt: "É longe daqui?" },
      { en: "Can you take me to this address?", pt: "Pode me levar a este endereço?" },
      { en: "I'm lost. Can you help me?", pt: "Estou perdida. Pode me ajudar?" }
    ]
  },
  {
    code: "SHP", color: "butter", name: "Compras", icon: "bag",
    role: "a shop assistant at a clothing store",
    roleLabel: "Vendedora",
    scene: "The learner is browsing in a clothing store.",
    phrases: [
      { en: "I'm just looking, thanks.", pt: "Só estou olhando, obrigada." },
      { en: "How much is this?", pt: "Quanto custa isto?" },
      { en: "Do you have this in a smaller size?", pt: "Tem isto num tamanho menor?" },
      { en: "Can I try it on?", pt: "Posso experimentar?", tip: "Provador é fitting room." },
      { en: "It's a bit expensive.", pt: "Está um pouco caro." },
      { en: "Do you take credit cards?", pt: "Vocês aceitam cartão de crédito?" },
      { en: "Can I get a receipt?", pt: "Pode me dar o recibo?", tip: "O 'p' é mudo: 'ri-sít'." },
      { en: "I'll take it.", pt: "Vou levar." }
    ]
  }
];

const LEVEL_TEST = [
  { q: "Hello! How ___ you?", options: ["is", "are", "am", "be"], answer: 1, why: "Com you, o verbo to be é are." },
  { q: "I ___ from Brazil.", options: ["is", "are", "am", "be"], answer: 2, why: "Com I, o verbo to be é am." },
  { q: "Como se pergunta \"Onde fica o banheiro?\"", options: ["Where the bathroom is?", "Where is the bathroom?", "Where are the bathroom?", "What is the bathroom?"], answer: 1, why: "Em perguntas, o verbo vem antes do sujeito: Where is the bathroom?" },
  { q: "She ___ coffee every morning.", options: ["drink", "drinking", "drinks", "is drink"], answer: 2, why: "No presente, he/she/it ganha -s: she drinks." },
  { q: "Yesterday I ___ to the beach.", options: ["go", "went", "goes", "gone"], answer: 1, why: "Yesterday pede passado: go vira went." },
  { q: "There ___ many people at the airport.", options: ["is", "are", "has", "be"], answer: 1, why: "Many people é plural: there are." },
  { q: "O garçom pergunta: \"Are you ready to order?\" Qual a melhor resposta?", options: ["Yes, I am soup.", "Yes, give soup.", "Yes, I'd like the soup, please.", "Yes, I like soup."], answer: 2, why: "I'd like... é o jeito educado de pedir. I like soup quer dizer que você gosta de sopa em geral." },
  { q: "I've never ___ to London.", options: ["went", "been", "go", "going"], answer: 1, why: "Com have/has, usa-se o particípio: I've never been." },
  { q: "If it rains tomorrow, we ___ stay at the hotel.", options: ["would", "did", "will", "are"], answer: 2, why: "Para algo possível no futuro: if + presente, will + verbo." },
  { q: "Could you tell me where the station ___?", options: ["is it", "is", "are", "be"], answer: 1, why: "Dentro de uma pergunta indireta, a ordem volta ao normal: where the station is." }
];

const LEVELS = {
  A1: { name: "A1 · Iniciante", note: "Você reconhece o básico. Foque nas frases prontas de cada situação e repita em voz alta." },
  A2: { name: "A2 · Básico", note: "Você já se vira em situações simples. Treine as conversas para ganhar agilidade." },
  B1: { name: "B1 · Intermediário", note: "Boa base. Use as conversas para soltar a fala e corrigir detalhes." }
};

function levelFromScore(score) {
  if (score >= 8) return "B1";
  if (score >= 5) return "A2";
  return "A1";
}

if (typeof module !== "undefined") module.exports = { SITUATIONS, LEVEL_TEST, LEVELS, levelFromScore };

// Malu, a malinha mascote. Desenho em traço (line art) com SVG.
// mascot(mood, size): mood = "wave" | "think" | "cheer" | "talk"

function mascot(mood, size) {
  mood = mood || "wave";
  size = size || 160;
  const S = 'stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';

  const eyes = {
    wave:  '<circle cx="86" cy="106" r="5" fill="var(--ink)"/><circle cx="116" cy="106" r="5" fill="var(--ink)"/><circle cx="87.6" cy="104.4" r="1.6" fill="var(--surface)"/><circle cx="117.6" cy="104.4" r="1.6" fill="var(--surface)"/>',
    talk:  '<circle cx="86" cy="106" r="5" fill="var(--ink)"/><circle cx="116" cy="106" r="5" fill="var(--ink)"/><circle cx="87.6" cy="104.4" r="1.6" fill="var(--surface)"/><circle cx="117.6" cy="104.4" r="1.6" fill="var(--surface)"/>',
    think: '<circle cx="89" cy="102" r="5" fill="var(--ink)"/><circle cx="119" cy="102" r="5" fill="var(--ink)"/><circle cx="91" cy="100.5" r="1.6" fill="var(--surface)"/><circle cx="121" cy="100.5" r="1.6" fill="var(--surface)"/>',
    cheer: `<path d="M80 108 q6 -8 12 0" fill="none" ${S}/><path d="M110 108 q6 -8 12 0" fill="none" ${S}/>`
  }[mood];

  const mouth = {
    wave:  `<path d="M92 120 q9 9 18 0" fill="none" ${S}/>`,
    think: `<path d="M98 123 h10" fill="none" ${S}/>`,
    talk:  `<ellipse cx="101" cy="123" rx="6" ry="5" fill="var(--ink)"/>`,
    cheer: `<path d="M89 118 h24 q0 14 -12 14 q-12 0 -12 -14z" fill="var(--ink)" ${S}/><path d="M95 127 q6 -4 12 0 q-6 5 -12 0z" fill="var(--pink-strong)"/>`
  }[mood];

  const arms = {
    wave:  `<path d="M52 122 q-16 8 -20 24" fill="none" ${S}/><circle cx="31" cy="149" r="5" fill="var(--surface)" ${S}/>
            <path d="M150 116 q18 -6 22 -30" fill="none" ${S}/><circle cx="173" cy="82" r="6" fill="var(--surface)" ${S}/>
            <path d="M182 66 l5 -6 M188 76 l8 -2 M176 60 l1 -8" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`,
    think: `<path d="M52 122 q-16 8 -20 24" fill="none" ${S}/><circle cx="31" cy="149" r="5" fill="var(--surface)" ${S}/>
            <path d="M150 120 q16 6 4 16 q-10 6 -26 -6" fill="none" ${S}/><circle cx="127" cy="129" r="6" fill="var(--surface)" ${S}/>
            <circle cx="160" cy="62" r="4" fill="none" stroke="var(--ink)" stroke-width="2.5"/><circle cx="172" cy="46" r="6" fill="none" stroke="var(--ink)" stroke-width="2.5"/><path d="M178 20 a12 12 0 1 1 6 22" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><circle cx="186" cy="46" r="1.8" fill="var(--ink)"/>`,
    talk:  `<path d="M52 122 q-16 8 -20 24" fill="none" ${S}/><circle cx="31" cy="149" r="5" fill="var(--surface)" ${S}/>
            <path d="M150 122 q16 8 20 24" fill="none" ${S}/><circle cx="171" cy="149" r="5" fill="var(--surface)" ${S}/>`,
    cheer: `<path d="M52 116 q-18 -6 -22 -30" fill="none" ${S}/><circle cx="29" cy="82" r="6" fill="var(--surface)" ${S}/>
            <path d="M150 116 q18 -6 22 -30" fill="none" ${S}/><circle cx="173" cy="82" r="6" fill="var(--surface)" ${S}/>`
  }[mood];

  const sparkle = (x, y, r, fill) => `<path d="M${x} ${y - r} C${x + r * 0.15} ${y - r * 0.15} ${x + r * 0.15} ${y - r * 0.15} ${x + r} ${y} C${x + r * 0.15} ${y + r * 0.15} ${x + r * 0.15} ${y + r * 0.15} ${x} ${y + r} C${x - r * 0.15} ${y + r * 0.15} ${x - r * 0.15} ${y + r * 0.15} ${x - r} ${y} C${x - r * 0.15} ${y - r * 0.15} ${x - r * 0.15} ${y - r * 0.15} ${x} ${y - r}z" fill="${fill}" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const extras = mood === "cheer"
    ? sparkle(20, 40, 12, "var(--ink)") + sparkle(186, 128, 9, "var(--surface)") + sparkle(42, 186, 7, "var(--surface)")
    : mood === "wave" ? sparkle(24, 70, 9, "var(--surface)") + sparkle(178, 170, 7, "var(--ink)") : "";

  return `<svg class="mascot" width="${size}" height="${size * 1.1}" viewBox="0 0 200 220" role="img" aria-label="Malu, a malinha mascote">
    <ellipse cx="100" cy="212" rx="48" ry="5" fill="var(--ink)" opacity=".08"/>
    ${extras}
    <path d="M84 186 v16" ${S}/><path d="M118 186 v16" ${S}/>
    <path d="M72 204 q0 -6 12 -6 q8 0 8 6 z" fill="var(--ink)" ${S}/><path d="M110 204 q0 -6 8 -6 q12 0 12 6 z" fill="var(--ink)" ${S}/>
    <path d="M80 62 v-14 a9 9 0 0 1 9 -9 h24 a9 9 0 0 1 9 9 v14" fill="none" ${S}/>
    <rect x="50" y="60" width="102" height="128" rx="24" fill="var(--surface)" ${S}/>
    <path d="M72 62 v124 M130 62 v124" stroke="var(--line-strong)" stroke-width="3" stroke-linecap="round"/>
    <rect x="60" y="150" width="22" height="22" rx="6" fill="var(--butter-strong)" stroke="var(--ink)" stroke-width="2.4" transform="rotate(-10 71 161)"/>
    <path d="M71 156 l1.8 3.6 4 .6 -2.9 2.8 .7 4 -3.6 -1.9 -3.6 1.9 .7 -4 -2.9 -2.8 4 -.6z" fill="var(--ink)" transform="rotate(-10 71 161)"/>
    <path d="M124 160 c0 -6 8 -6 8 0 c0 -6 8 -6 8 0 c0 6 -8 10 -8 12 c0 -2 -8 -6 -8 -12z" fill="var(--pink-strong)" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/>
    <ellipse cx="76" cy="119" rx="6" ry="3.5" fill="var(--pink-strong)" opacity=".8"/><ellipse cx="126" cy="119" rx="6" ry="3.5" fill="var(--pink-strong)" opacity=".8"/>
    ${eyes}
    ${mouth}
    ${arms}
  </svg>`;
}

if (typeof module !== "undefined") module.exports = { mascot };

// Inglês de Viagem — app em JavaScript puro, com a Malu (mascote) guiando.
// Roda em dois lugares:
//  1) como Artifact no claude.ai (progresso na conta + tutor via window.claude)
//  2) localmente (node server.js): progresso no navegador + tutor via /api/tutor

(function () {
  "use strict";

  const STORAGE_KEY = "ingles-viagem:v1";
  const USER_NAME = "Laís";
  const IN_ARTIFACT = typeof window.claude !== "undefined" && window.claude && typeof window.claude.use === "function";
  const TOTAL_PHRASES = SITUATIONS.reduce((n, s) => n + s.phrases.length, 0);

  // ---------- Ícones (traço) ----------
  const ICONS = {
    plane: '<path d="M2 16l20-6-20-6 4 6-4 6z"/><path d="M6 10h8"/>',
    passport: '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/>',
    bed: '<path d="M3 18V7"/><path d="M3 13h18v5"/><path d="M7 13V10h5v3"/>',
    fork: '<path d="M7 3v8a2 2 0 0 0 2 2v8"/><path d="M11 3v8a2 2 0 0 1-2 2"/><path d="M16 21V3c2 1 3 3 3 6s-1 4-3 4"/>',
    train: '<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14"/><path d="M8 21l2-4M16 21l-2-4"/>',
    bag: '<path d="M5 8h14l-1 13H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    sound: '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/>',
    home: '<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
    test: '<path d="M9 4h6v3H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="M9 13l2 2 4-4"/>',
    map: '<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/>',
    arrow: '<path d="M7 17L17 7"/><path d="M9 7h8v8"/>',
    back: '<path d="M15 6l-6 6 6 6"/>'
  };
  const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- Estado ----------
  const emptyState = () => ({ xp: 0, level: null, testScore: null, learned: {}, quiz: {}, days: [], chats: 0 });
  let state = emptyState();
  let store = null;
  let tutor = undefined; // undefined = carregando; null = indisponível

  const newChat = (code) => ({ code, turns: [], busy: false, hint: "", lastHint: "", error: "" });
  const ui = { tab: "inicio", sit: null, quiz: null, test: null, chat: newChat("AIR") };

  const dayKey = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const today = () => dayKey(new Date());
  function streak() {
    const set = new Set(state.days), d = new Date();
    if (!set.has(today())) d.setDate(d.getDate() - 1);
    let n = 0;
    while (set.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  const learnedCount = (code) => (state.learned[code] || []).length;
  const totalLearned = () => SITUATIONS.reduce((n, s) => n + learnedCount(s.code), 0);
  const quizDone = () => SITUATIONS.filter((s) => state.quiz[s.code] != null).length;
  const sitByCode = (code) => SITUATIONS.find((x) => x.code === code);

  function gain(xp) {
    state.xp += xp;
    const t = today();
    if (!state.days.includes(t)) { state.days.push(t); state.days = state.days.slice(-90); }
    save();
  }

  // ---------- Armazenamento ----------
  async function initStore() {
    if (IN_ARTIFACT) {
      try {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        const id = user ? await user.id() : null;
        if (db && id) {
          const ref = db.doc("data/users/" + id + "/progress");
          return {
            kind: "conta",
            load: async () => { const s = await ref.get(); return s.exists ? s.data() : null; },
            save: (d) => ref.set(d)
          };
        }
      } catch (e) { /* usa o navegador */ }
    }
    return {
      kind: "navegador",
      load: async () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (e) { return null; } },
      save: async (d) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) { /* sem armazenamento */ } }
    };
  }
  let saveTimer = null, saving = false, dirty = false;
  function save() { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
  async function flush() {
    if (!store || saving || !dirty) return;
    saving = true; dirty = false;
    try { await store.save(JSON.parse(JSON.stringify(state))); } catch (e) { /* tenta na próxima mudança */ }
    saving = false;
    if (dirty) flush();
  }

  // ---------- Tutor de IA ----------
  async function initTutor() {
    if (IN_ARTIFACT) {
      const sample = await window.claude.use("sample");
      return sample ? { ask: (prompt) => sample.json(prompt, { modelTier: "quick", cache: false }) } : null;
    }
    if (location.protocol.startsWith("http")) {
      return {
        ask: async (prompt) => {
          const r = await fetch("/api/tutor", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ prompt }) });
          if (!r.ok) throw { code: "upstream_error" };
          return (await r.json()).data;
        }
      };
    }
    return null;
  }
  const ERRORS = {
    not_granted: "O tutor precisa da sua permissão para usar o Claude. Recarregue a página para permitir.",
    sampling_disabled: "O tutor não está disponível nesta conta.",
    rate_limited: "Muitas mensagens seguidas. Espere um pouco e tente de novo.",
    session_expired: "Sua sessão expirou. Entre de novo no claude.ai.",
    invalid_json: "A resposta veio num formato inesperado. Tente enviar de novo.",
    refused: "Essa mensagem não pôde ser respondida. Tente escrever de outro jeito."
  };
  const errorText = (e) => ERRORS[e && e.code] || "Não deu para falar com o tutor agora. Tente de novo.";
  const hideTutor = (e) => ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e && e.code);

  // ---------- Áudio ----------
  const canSpeak = typeof window.speechSynthesis !== "undefined";
  function speak(text) {
    if (!canSpeak) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.85;
      const v = speechSynthesis.getVoices().find((x) => x.lang && x.lang.startsWith("en-US"));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) { /* áudio indisponível */ }
  }

  // ---------- Peças visuais ----------
  function ring(pct, label, value) {
    const r = 38, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
    return `<div class="ring-card">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="${r}" fill="none" stroke-width="10"/>
        <circle class="ring-fill" cx="50" cy="50" r="${r}" fill="none" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)" ${p === 0 ? 'stroke-opacity="0"' : ""}/>
        <text class="ring-value" x="50" y="57" text-anchor="middle">${esc(value)}</text>
      </svg>
      <span>${esc(label)}</span>
    </div>`;
  }

  function destCard(s) {
    const n = learnedCount(s.code), best = state.quiz[s.code];
    return `<button class="dest tone-${s.color}" data-go="sit:${s.code}">
      <span class="circle">${icon(s.icon)}</span>
      <h3>${esc(s.name)}</h3>
      <p>${esc(s.phrases[0].en)}</p>
      <span class="row"><span class="pill">${n}/${s.phrases.length} frases</span>${best != null ? `<span class="pill pill-dark">treino ${best}/5</span>` : ""}</span>
    </button>`;
  }

  // ---------- Casca ----------
  const NAV = [["inicio", "Início", "home"], ["situacoes", "Situações", "map"], ["teste", "Teste", "test"], ["conversa", "Conversar", "chat"]];
  const $app = document.getElementById("app");
  document.getElementById("logo").innerHTML = `${mascot("wave", 44)}<span class="logo-text">Malu English<span>Inglês de viagem</span></span>`;

  function renderShell() {
    document.getElementById("nav").innerHTML = NAV.map(([id, label, ic]) =>
      `<button class="nav-item" data-tab="${id}" ${ui.tab === id ? 'aria-current="page"' : ""}>${icon(ic)}<span>${label}</span></button>`).join("");
    document.getElementById("side-xp").innerHTML = `<strong>${state.xp} XP</strong><span>${streak()} ${streak() === 1 ? "dia seguido" : "dias seguidos"}</span>`;
  }

  function render() {
    renderShell();
    const views = { inicio: viewHome, teste: viewTest, situacoes: viewSituations, conversa: viewChat };
    $app.innerHTML = views[ui.tab]();
    if (ui.tab === "conversa") { const c = document.getElementById("chat-end"); if (c) c.scrollIntoView({ block: "nearest" }); }
  }

  // ---------- Telas ----------
  function nextStep() {
    if (!state.level) return { say: "Oi! Eu sou a Malu. Vamos descobrir seu nível? São só 10 perguntas.", go: "teste", label: "Fazer o teste", sub: "10 perguntas · 3 minutos" };
    const s = SITUATIONS.slice().sort((a, b) => learnedCount(a.code) / a.phrases.length - learnedCount(b.code) / b.phrases.length)[0];
    if (learnedCount(s.code) < s.phrases.length) return { say: `Próxima parada: ${s.name}. Ouça as frases e repita em voz alta comigo!`, go: "sit:" + s.code, label: "Ir para " + s.name, sub: `${learnedCount(s.code)}/${s.phrases.length} frases aprendidas` };
    return { say: "Você já marcou todas as frases. Agora é hora de conversar!", go: "conversa", label: "Conversar", sub: "Tutor de IA com correção" };
  }

  function viewHome() {
    const n = nextStep();
    const lvlPct = state.level ? { A1: 1 / 3, A2: 2 / 3, B1: 1 }[state.level] : 0;
    return `
      <div class="top-row">
        <div><span class="label">Painel de estudos</span><h1>Hello, ${esc(USER_NAME)}!</h1></div>
        <span class="pill">${state.level ? esc(LEVELS[state.level].name) : "Nível ainda não definido"}</span>
      </div>
      <div class="home-grid">
        <div class="main" style="padding:0">
          <section class="hero">
            <div style="display:grid;gap:14px">
              <span class="bubble">${esc(n.say)}</span>
              <h2>Aprenda o inglês da sua próxima viagem</h2>
              <div class="row"><button class="btn" data-go="${n.go}">${esc(n.label)}</button></div>
            </div>
            ${mascot("wave", 170)}
          </section>
          <div class="section-head"><h2>Recomendado para você</h2><button class="link" data-go="situacoes">Ver todos</button></div>
          <div class="dest-grid">${recommended().map(destCard).join("")}</div>
          <button class="continue" data-go="conversa">
            <span class="circle">${icon("chat")}</span>
            <span><strong>Conversar com o tutor</strong><small>Pratique uma situação real e receba correções</small></span>
            <span class="arrow">${icon("arrow")}</span>
          </button>
        </div>
        <div class="rings">
          ${ring(totalLearned() / TOTAL_PHRASES, "Frases aprendidas", Math.round((totalLearned() / TOTAL_PHRASES) * 100) + "%")}
          ${ring(quizDone() / SITUATIONS.length, "Treinos feitos", quizDone() + "/" + SITUATIONS.length)}
          ${ring(lvlPct, "Nível", state.level || "–")}
        </div>
      </div>
      <p class="foot">Progresso salvo ${store ? (store.kind === "conta" ? "na sua conta" : "neste navegador") : "…"}. Estudar 20 minutos por dia rende mais que 2 horas no fim de semana.</p>`;
  }

  function recommended() {
    return SITUATIONS.slice().sort((a, b) => learnedCount(a.code) / a.phrases.length - learnedCount(b.code) / b.phrases.length).slice(0, 2);
  }

  function viewSituations() {
    if (ui.quiz) return viewQuiz();
    if (!ui.sit) return `
      <div><span class="label">6 destinos · ${TOTAL_PHRASES} frases</span><h1>Situações de viagem</h1></div>
      <p class="muted">Escolha uma etapa da viagem. Ouça cada frase, repita em voz alta e marque quando souber.</p>
      <div class="dest-grid">${SITUATIONS.map(destCard).join("")}</div>`;
    const s = sitByCode(ui.sit), learned = state.learned[s.code] || [];
    return `
      <button class="back" data-go="situacoes">${icon("back")}Todos os destinos</button>
      <section class="sit-hero tone-${s.color}">
        <span class="circle">${icon(s.icon)}</span>
        <div><span class="label">${learned.length}/${s.phrases.length} aprendidas</span><h1>${esc(s.name)}</h1></div>
      </section>
      <ul class="phrases">${s.phrases.map((p, i) => `<li class="phrase">
        <input type="checkbox" class="check" id="ph-${s.code}-${i}" data-learn="${s.code}:${i}" ${learned.includes(i) ? "checked" : ""} aria-label="Marcar como aprendida">
        <label for="ph-${s.code}-${i}" style="display:grid;gap:2px;cursor:pointer">
          <span class="phrase-en">${esc(p.en)}</span>
          <span class="phrase-pt">${esc(p.pt)}</span>
          ${p.tip ? `<span><span class="phrase-tip">${esc(p.tip)}</span></span>` : ""}
        </label>
        ${canSpeak ? `<button class="icon-btn" data-say="${s.code}:${i}" aria-label="Ouvir">${icon("sound")}</button>` : "<span></span>"}
      </li>`).join("")}</ul>
      <div class="row">
        <button class="btn" data-quiz="${s.code}">Treinar estas frases</button>
        <button class="btn btn-soft" data-chat="${s.code}">Conversar nesta situação</button>
      </div>`;
  }

  function startQuiz(code) {
    const s = sitByCode(code);
    const shuffle = (a) => a.sort(() => Math.random() - 0.5);
    const idx = shuffle(s.phrases.map((_, i) => i)).slice(0, 5);
    const items = idx.map((i) => {
      const options = shuffle([i, ...shuffle(s.phrases.map((_, j) => j).filter((j) => j !== i)).slice(0, 3)]);
      return { pt: s.phrases[i].pt, options: options.map((j) => s.phrases[j].en), answer: options.indexOf(i) };
    });
    ui.quiz = { code, items, i: 0, score: 0, picked: null };
  }

  function quizShell(mood, side, main) {
    return `<div class="quiz"><section class="panel">${main}</section><aside class="quiz-side">${mascot(mood, 150)}${side}</aside></div>`;
  }

  function viewQuiz() {
    const q = ui.quiz, s = sitByCode(q.code);
    if (q.i >= q.items.length) {
      const msg = q.score === 5 ? "Perfeito! Você está pronta para essa etapa da viagem." : q.score >= 3 ? "Bom resultado! Revise as que errou e tente de novo." : "Volte às frases, ouça cada uma e repita em voz alta antes de tentar de novo.";
      return `<section class="panel result">${mascot(q.score >= 3 ? "cheer" : "think", 150)}
        <span class="label">${esc(s.name)} · treino concluído</span>
        <span class="result-level">${q.score}/5</span><p>${msg}</p>
        <div class="row" style="justify-content:center"><button class="btn" data-quiz="${s.code}">Treinar de novo</button><button class="btn btn-soft" data-go="sit:${s.code}">Voltar às frases</button></div>
      </section>`;
    }
    const it = q.items[q.i];
    const main = `
      <div class="row" style="justify-content:space-between"><button class="back" style="background:var(--surface-2)" data-go="sit:${s.code}">${icon("back")}${esc(s.name)}</button><span class="pill" style="background:var(--surface-2)">${q.i + 1} de ${q.items.length}</span></div>
      <div class="bar"><span style="width:${(q.i / q.items.length) * 100}%"></span></div>
      <span class="muted">Como se diz em inglês:</span>
      <span class="q-text">${esc(it.pt)}</span>
      <div class="options">${it.options.map((o, j) => {
        const cls = q.picked == null ? "" : j === it.answer ? "right" : j === q.picked ? "wrong" : "";
        return `<button class="opt ${cls}" data-qpick="${j}" ${q.picked != null ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}</div>
      ${q.picked != null ? `<div class="row"><button class="btn" data-qnext>${q.i + 1 < q.items.length ? "Próxima" : "Ver resultado"}</button>${canSpeak ? `<button class="btn btn-soft" data-saytext="${esc(it.options[it.answer])}">Ouvir a resposta</button>` : ""}</div>` : ""}`;
    const said = q.picked == null ? "Você consegue!" : q.picked === it.answer ? "Isso aí!" : "Quase! Veja a certa em verde.";
    return quizShell(q.picked == null ? "think" : q.picked === it.answer ? "cheer" : "talk", `<span class="bubble">${said}</span>`, main);
  }

  function viewTest() {
    const t = ui.test;
    if (!t) {
      return `<section class="panel start-card tone-lilac">${mascot("think", 130)}
        <div style="display:grid;gap:12px">
          <span class="label">10 perguntas · cerca de 3 minutos</span>
          <h1>Teste de nível</h1>
          <p>Responda sem consultar nada. Se não souber, chute: o resultado serve para ajustar o tutor e indicar por onde começar.</p>
          ${state.level ? `<p class="muted">Seu último resultado: <strong>${esc(LEVELS[state.level].name)}</strong> (${state.testScore}/10).</p>` : ""}
          <div class="row"><button class="btn" data-test-start>${state.level ? "Refazer o teste" : "Começar"}</button></div>
        </div>
      </section>`;
    }
    if (t.i >= LEVEL_TEST.length) {
      const lvl = levelFromScore(t.score);
      return `<section class="panel result">${mascot("cheer", 160)}
        <span class="label">Resultado · ${t.score}/10 acertos</span>
        <span class="result-level">${lvl}</span><h2>${esc(LEVELS[lvl].name)}</h2><p>${esc(LEVELS[lvl].note)}</p>
        <div class="row" style="justify-content:center"><button class="btn" data-go="situacoes">Ver as situações</button><button class="btn btn-soft" data-go="conversa">Conversar com o tutor</button></div>
      </section>`;
    }
    const q = LEVEL_TEST[t.i];
    const main = `
      <div class="row" style="justify-content:space-between"><span class="label">Teste de nível</span><span class="pill" style="background:var(--surface-2)">${t.i + 1} de ${LEVEL_TEST.length}</span></div>
      <div class="bar"><span style="width:${(t.i / LEVEL_TEST.length) * 100}%"></span></div>
      <span class="q-text">${esc(q.q)}</span>
      <div class="options">${q.options.map((o, j) => {
        const cls = t.picked == null ? "" : j === q.answer ? "right" : j === t.picked ? "wrong" : "";
        return `<button class="opt ${cls}" data-tpick="${j}" ${t.picked != null ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}</div>
      ${t.picked != null ? `<p class="explain">${esc(q.why)}</p><div class="row"><button class="btn" data-tnext>${t.i + 1 < LEVEL_TEST.length ? "Próxima" : "Ver meu nível"}</button></div>` : ""}`;
    const said = t.picked == null ? "Sem pressa. Leia com calma." : t.picked === q.answer ? "Mandou bem!" : "Tudo bem errar, é assim que se aprende.";
    return quizShell(t.picked == null ? "think" : t.picked === q.answer ? "cheer" : "talk", `<span class="bubble">${said}</span>`, main);
  }

  function viewChat() {
    const c = ui.chat, s = sitByCode(c.code);
    const chips = SITUATIONS.map((x) => `<button class="chip" data-chatsit="${x.code}" aria-pressed="${x.code === c.code}" ${c.busy ? "disabled" : ""}>${icon(x.icon)}${esc(x.name)}</button>`).join("");
    let body;
    if (tutor === undefined) body = `<section class="panel"><p class="muted">Conectando o tutor…</p></section>`;
    else if (tutor === null) body = `<section class="panel start-card">${mascot("think", 120)}<div style="display:grid;gap:8px"><h2>Tutor indisponível aqui</h2><p class="muted">${IN_ARTIFACT ? "Esta visualização não permite usar o Claude. Abra a página no claude.ai, com sua conta." : "Rode o projeto com npm start e uma chave de API para conversar com o tutor."} As frases e os treinos funcionam normalmente.</p></div></section>`;
    else if (!c.turns.length && !c.busy) {
      body = `<section class="panel start-card tone-${s.color}">${mascot("talk", 130)}
        <div style="display:grid;gap:12px">
          <span class="label">Você vai falar com: ${esc(s.roleLabel)}</span>
          <h2>${esc(s.name)}</h2>
          <p>O tutor faz o papel de ${esc(s.roleLabel.toLowerCase())} e responde em inglês. Depois de cada mensagem sua, a Malu comenta em português. Escreva do seu jeito; se travar, peça uma dica.</p>
          ${c.error ? `<p class="notice">${esc(c.error)}</p>` : ""}
          <div class="row"><button class="btn" data-chat-start>Começar conversa</button></div>
        </div>
      </section>`;
    } else {
      const msgs = c.turns.map((t) => {
        if (t.role === "them") return `<div class="msg msg-them"><span class="msg-who">${esc(s.roleLabel)}</span><span>${esc(t.text)}</span>
          <span class="msg-actions">${t.pt ? `<details><summary class="link">Tradução</summary><span class="msg-pt">${esc(t.pt)}</span></details>` : ""}${canSpeak ? `<button class="link" data-saytext="${esc(t.text)}">Ouvir</button>` : ""}</span></div>`;
        let html = `<div class="msg msg-me"><span class="msg-who">Você</span><span>${esc(t.text)}</span></div>`;
        if (t.fb) html += `<div class="fb ${t.better ? "fb-fix" : "fb-ok"}"><span class="avatar">${mascot(t.better ? "talk" : "cheer", 40)}</span><div class="fb-body"><span>${esc(t.fb)}</span>${t.better ? `<span class="fb-better">${esc(t.better)}</span>` : ""}</div></div>`;
        return html;
      }).join("");
      body = `<section class="chat-wrap">
        <div class="chat" aria-live="polite">${msgs}${c.busy ? `<p class="thinking">${esc(s.roleLabel)} está respondendo…</p>` : ""}<span id="chat-end"></span></div>
        ${c.error ? `<p class="notice">${esc(c.error)}</p>` : ""}
        ${c.hint ? `<div class="hint"><strong>Dica da Malu:</strong> ${esc(c.hint)}</div>` : ""}
        <form class="composer" id="composer">
          <input id="chat-input" autocomplete="off" placeholder="Escreva em inglês…" ${c.busy ? "disabled" : ""} aria-label="Sua mensagem">
          <button class="btn" ${c.busy ? "disabled" : ""}>Enviar</button>
        </form>
        <div class="row"><button class="btn btn-soft" data-hint ${c.busy || !c.lastHint ? "disabled" : ""}>Preciso de uma dica</button><button class="link" data-chat-reset ${c.busy ? "disabled" : ""}>Recomeçar</button></div>
      </section>`;
    }
    return `
      <div><span class="label">Tutor de IA · nível ${state.level || "A1"}</span><h1>Conversar</h1></div>
      <div class="chips">${chips}</div>
      ${body}`;
  }

  // ---------- Conversa ----------
  function buildPrompt(s) {
    const level = state.level || "A1";
    const transcript = ui.chat.turns.slice(-12).map((t) => (t.role === "me" ? "Learner: " : s.roleLabel + ": ") + t.text).join("\n");
    const lastMe = [...ui.chat.turns].reverse().find((t) => t.role === "me");
    return `You are an English tutor running a travel role-play with a Brazilian learner who speaks Portuguese. Learner level (CEFR): ${level}.
You play: ${s.role}. Scene: ${s.scene} Stay in character.

Fields to return:
- "reply": your next line in character, natural spoken English, 1-2 short sentences, vocabulary suited to ${level}. End with a question or a prompt the learner must answer. Never write Portuguese here.
- "reply_pt": Brazilian Portuguese translation of "reply".
- "feedback_pt": in Brazilian Portuguese, friendly, at most 2 short sentences about the learner's LAST message. Praise it if it was correct and natural; if it had a mistake, explain the mistake simply. If the learner wrote in Portuguese, encourage them and show how to say it. Use "" if the learner has not written yet.
- "correct_version": a natural, corrected English version of the learner's last message, or "" if it was already correct (or there is no learner message yet).
- "hint_pt": in Portuguese, a suggestion of how the learner could answer your reply, with one short example in English in quotes.

${transcript ? "Conversation so far:\n" + transcript : "The conversation has not started. Open the scene with your first line."}
${lastMe ? "\nThe learner's last message is: " + lastMe.text : ""}

Reply with only a JSON object: {"reply":"...","reply_pt":"...","feedback_pt":"...","correct_version":"...","hint_pt":"..."}`;
  }

  async function chatStep() {
    const c = ui.chat, s = sitByCode(c.code), code = c.code;
    c.busy = true; c.error = ""; c.hint = ""; render();
    try {
      const data = await tutor.ask(buildPrompt(s));
      if (ui.chat !== c || c.code !== code) return;
      const lastMe = [...c.turns].reverse().find((t) => t.role === "me");
      if (lastMe && !lastMe.fb) {
        lastMe.fb = String(data.feedback_pt || "Muito bem!");
        const better = String(data.correct_version || "").trim();
        lastMe.better = better && better !== lastMe.text.trim() ? better : "";
      }
      c.turns.push({ role: "them", text: String(data.reply || "Sorry, could you say that again?"), pt: String(data.reply_pt || "") });
      c.lastHint = String(data.hint_pt || "");
      if (lastMe) { state.chats++; gain(3); }
    } catch (e) {
      if (hideTutor(e)) tutor = null;
      c.error = errorText(e);
    } finally {
      c.busy = false;
      if (ui.chat === c) { render(); const input = document.getElementById("chat-input"); if (input) input.focus(); }
    }
  }

  // ---------- Eventos ----------
  function go(target) {
    ui.quiz = null;
    if (target.startsWith("sit:")) { ui.tab = "situacoes"; ui.sit = target.slice(4); }
    else { ui.tab = target; if (target === "situacoes") ui.sit = null; if (target === "teste" && ui.test && ui.test.i >= LEVEL_TEST.length) ui.test = null; }
    render(); window.scrollTo(0, 0);
  }

  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("button");
    if (!el) return;
    const d = el.dataset;
    if (d.tab) return go(d.tab);
    if (d.go) return go(d.go);
    if (d.say) { const [code, i] = d.say.split(":"); speak(sitByCode(code).phrases[+i].en); return; }
    if (d.saytext) return speak(d.saytext);
    if (d.quiz) { startQuiz(d.quiz); ui.tab = "situacoes"; render(); window.scrollTo(0, 0); return; }
    if (d.qpick != null && ui.quiz && ui.quiz.picked == null) {
      ui.quiz.picked = +d.qpick;
      if (+d.qpick === ui.quiz.items[ui.quiz.i].answer) { ui.quiz.score++; gain(5); }
      render(); return;
    }
    if ("qnext" in d && ui.quiz) {
      ui.quiz.i++; ui.quiz.picked = null;
      if (ui.quiz.i >= ui.quiz.items.length) { state.quiz[ui.quiz.code] = Math.max(state.quiz[ui.quiz.code] || 0, ui.quiz.score); save(); }
      render(); return;
    }
    if ("testStart" in d) { ui.test = { i: 0, score: 0, picked: null }; render(); return; }
    if (d.tpick != null && ui.test && ui.test.picked == null) {
      ui.test.picked = +d.tpick;
      if (+d.tpick === LEVEL_TEST[ui.test.i].answer) ui.test.score++;
      render(); return;
    }
    if ("tnext" in d && ui.test) {
      ui.test.i++; ui.test.picked = null;
      if (ui.test.i >= LEVEL_TEST.length) { state.level = levelFromScore(ui.test.score); state.testScore = ui.test.score; gain(20); }
      render(); return;
    }
    if (d.chat) { ui.tab = "conversa"; if (ui.chat.code !== d.chat) ui.chat = newChat(d.chat); render(); window.scrollTo(0, 0); return; }
    if (d.chatsit && !ui.chat.busy) { ui.chat = newChat(d.chatsit); render(); return; }
    if ("chatStart" in d && tutor) return chatStep();
    if ("chatReset" in d) { ui.chat = newChat(ui.chat.code); render(); return; }
    if ("hint" in d) { ui.chat.hint = ui.chat.lastHint || ""; render(); return; }
  });

  document.addEventListener("change", (ev) => {
    const d = ev.target.dataset;
    if (!d || !d.learn) return;
    const [code, i] = d.learn.split(":"), n = +i;
    const list = state.learned[code] || (state.learned[code] = []);
    if (ev.target.checked && !list.includes(n)) { list.push(n); gain(2); }
    else if (!ev.target.checked) { state.learned[code] = list.filter((x) => x !== n); save(); }
    render();
  });

  document.addEventListener("submit", (ev) => {
    if (ev.target.id !== "composer") return;
    ev.preventDefault();
    const text = document.getElementById("chat-input").value.trim();
    if (!text || ui.chat.busy || !tutor) return;
    ui.chat.turns.push({ role: "me", text });
    chatStep();
  });

  // ---------- Início ----------
  render();
  (async () => {
    store = await initStore();
    try { const saved = await store.load(); if (saved && typeof saved === "object") state = Object.assign(emptyState(), saved); } catch (e) { /* começa do zero */ }
    render();
  })();
  initTutor().then((t) => { tutor = t; if (ui.tab === "conversa") render(); }).catch(() => { tutor = null; render(); });
})();
</script>
</body>
</html>
